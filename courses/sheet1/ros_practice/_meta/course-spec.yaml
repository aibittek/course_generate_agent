  - id: exp06
    experiment_id: 6
    name: ROS2话题通讯(MQ5气体传感器)
    hours: 4
    difficulty: 2
    difficulty_stars: "⭐⭐"
    experiment_type: 设计性
    source_code_path: source-codes/ros_sensor/
    main_entry: gas_sensor_node.py(发布) + gas_monitor.py(订阅)
    objectives:
      - 掌握ROS2话题通信的发布者/订阅者模型
      - 能够使用标准Float32消息接口实现MQ5气体传感器数据的持续发布与订阅
    exp_content:
      - 案例:MQ5可燃气体传感器(ADC模拟量采集)通过Topic发布浓度数据
      - 编写gas_sensor_node发布节点:declare_parameter('publish_period',1.0)声明发布周期→配置QoSProfile(Reliable+KeepLast(10))→create_publisher(Float32,'/gas_sensor')→定时器回调调用common.read_mq5_once()读取ADC原始值并换算电压与ppm(voltage_to_ppm对数曲线)→publish浓度值
      - 编写gas_monitor订阅节点:declare_parameter('alarm_threshold',500.0)→create_subscription(Float32,'/gas_sensor',callback)→回调中判断浓度是否超阈值并log_warn报警
      - 使用ros2 topic echo /gas_sensor观察实时浓度
      - ros2 topic hz /gas_sensor查看发布频率
      - 使用--ros-args -p publish_period:=0.5调整发布周期
      - 对比话题(持续数据流)与服务/动作的适用场景
    notes: 有资源，可复用

  - id: exp07
    experiment_id: 7
    name: ROS2服务通讯(指纹传感器)
    hours: 4
    difficulty: 2
    difficulty_stars: "⭐⭐"
    experiment_type: 设计性
    source_code_path: source-codes/ros_sensor/
    main_entry: fingerprint_server.py(服务端) + fingerprint_client.py(客户端)
    objectives:
      - 掌握ROS2服务通信的客户端/服务器同步RPC模型
      - 能够基于UART串口实现指纹传感器的身份验证服务
    exp_content:
      - 案例:指纹传感器(UART串口)通过Service提供指纹验证
      - 编写fingerprint_server服务端节点:declare_parameter(port默认/dev/ttyS10,baud默认57600,retries)→create_service(VerifyFingerprint,'/verify_fingerprint',handle_request)→回调中通过串口采集指纹图像(get_image)→生成特征(gen_char)→搜索指纹库(search)→返回Response{success:bool,user_id:int32,message:string}
      - 编写fingerprint_client客户端节点:create_client(VerifyFingerprint,'verify_fingerprint')→wait_for_service等待服务→call_async发送验证请求→spin_until_future_complete等待响应→打印success/user_id/message
      - 指纹录入用python3 fingerprint_enroll.py enroll -i 1独立完成(ROS仅做验证)
      - 使用ros2 service call /verify_fingerprint ros_sensor_interfaces/srv/VerifyFingerprint查看验证结果
      - 对比服务(同步请求-响应单次调用)与话题(持续数据流)的适用场景
    notes: 有资源，可复用

  - id: exp08
    experiment_id: 8
    name: ROS2动作通讯(MFRC522读卡器)
    hours: 4
    difficulty: 2
    difficulty_stars: "⭐⭐"
    experiment_type: 设计性
    source_code_path: source-codes/ros_sensor/
    main_entry: rfid_action_server.py(服务端) + rfid_action_client.py(客户端)
    objectives:
      - 掌握ROS2动作通信的目标-反馈-结果异步模型
      - 能够基于SPI接口实现MFRC522刷卡检测的长耗时异步动作任务
    exp_content:
      - 案例:MFRC522射频读卡器(SPI+GPIO)通过Action实现刷卡检测
      - 编写rfid_action_server节点:ActionServer(RfidScan,'rfid_scan',execute_callback,goal_callback,cancel_callback)→declare_parameter(spi_bus/spi_device/cs_gpio/rst_gpio/spi_speed)→execute_cb中SPI初始化(MFRC522.open→hw_reset→self_test→init)→循环内publish_feedback实时反馈状态(SCANNING→CARD_FOUND→READING_UID→VERIFYING)→request_a寻卡+anticoll防冲突读取UID→classify_card判断卡类型→goal_handle.succeed返回Result{success,card_uid,card_type,message}
      - 编写rfid_action_client节点:ActionClient(RfidScan,'rfid_scan')→send_goal_async发送Goal{timeout_sec默认30}→feedback_cb打印状态→result_cb处理读卡结果
      - 实现动作取消(超时未检测到卡或主动cancel→goal_handle.canceled)
      - 使用ros2 action send_goal /rfid_scan ros_sensor_interfaces/action/RfidScan '{timeout_sec:30}' --feedback命令行调试
      - 对比动作(异步长耗时+中间反馈)、服务(同步短耗时单次调用)、话题(持续数据流)的适用场景
    notes: 有资源，可复用

  - id: exp09
    experiment_id: 9
    name: ROS2自定义接口消息(传感器接口包)
    hours: 2
    difficulty: 2
    difficulty_stars: "⭐⭐"
    experiment_type: 设计性
    source_code_path: source-codes/ros_sensor/ros_sensor_interfaces/
    objectives:
      - 掌握自定义消息接口(.msg/.srv/.action)的定义与编译
      - 能够为MQ5/指纹/MFRC522等传感器创建ros_sensor_interfaces接口包
    exp_content:
      - 定义ros_sensor_interfaces接口包(ament_cmake)包含传感器专用接口:msg/TemperatureHumidity(float32 temperature,float32 humidity)用于DHT11温湿度
      - msg/HeartRateSpO2(float32 heart_rate,float32 spo2,bool valid)用于MAX30102心率血氧
      - msg/PhotoState(bool level,bool changed)用于光电传感器
      - srv/VerifyFingerprint请求(空)响应(bool success,int32 user_id,string message)用于指纹验证
      - srv/TriggerRelay请求(int32 relay_id,float32 duration)响应(bool success,string message)用于继电器控制
      - action/RfidScan定义Goal(int32 timeout_sec)与Result(bool success,string card_uid,string card_type,string message)与Feedback(string status)用于刷卡检测
      - 在CMakeLists.txt中配置rosidl_generate_interfaces编译.msg/.srv/.action
      - 节点包ros_sensor在package.xml中声明<depend>ros_sensor_interfaces</depend>
      - 使用ros2 interface show ros_sensor_interfaces/srv/VerifyFingerprint等查看接口定义
      - 对比标准接口(std_msgs/example_interfaces)与自定义传感器专用接口的差异
    notes: 有资源，可复用

