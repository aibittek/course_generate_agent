experiments:
  - id: exp01
    experiment_id: 1
    name: 基于YOLOv8的工业表面缺陷检测实验
    hours: 4
    difficulty: 3
    difficulty_stars: "⭐⭐⭐"
    experiment_type: 综合性
    source_code_path: ros2_ws/src/xflz_eai_car1/vision/01_industrial_defect_detection/
    main_entry: src/app.py
    knowledge_points:
      - YOLOv8模型架构
      - 工业缺陷数据集
      - ONNX模型转换
      - RKNN NPU部署
      - 实时缺陷检测
    objectives:
      - 掌握YOLOv8目标检测模型的工业应用方法
      - 完成工业产品的缺陷自动检测与定位
      - 理解工业质检场景下的数据集制作、模型训练、部署推理全流程
    exp_content:
      - 工业缺陷数据集准备与标注
      - YOLOv8模型架构理解与超参数配置
      - 基于PyTorch的YOLOv8模型训练与验证
      - 模型导出ONNX/RKNN并部署到6TOPS NPU
      - 实现实时缺陷检测与缺陷类别识别
      - 缺陷统计与质检报告生成
    notes: 源码已就位;已测试;板端验证通过13fps

