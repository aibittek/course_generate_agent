    difficulty: 2
    difficulty_stars: "⭐⭐"
    experiment_type: 设计性
    source_code_path: ros2_ws/src/xflz_eai_car1/vision/02_garbage_classification/
    main_entry: src/app.py
    knowledge_points:
      - 图像分类原理
      - MobileNet模型
      - 数据集搭建
      - 模型训练
      - RKNN部署
    objectives:
      - 掌握图像分类数据集搭建与模型训练流程
      - 实现基于视觉的垃圾分类与机械臂分拣联动
    exp_content:
      - 搭建垃圾分类数据集（可回收、厨余、有害、其他四类）
      - 使用图像分类模型MobileNet/ResNet训练并评估分类器
      - 实现摄像头实时拍摄并自动分类输出类别名称与置信度
      - 根据分类结果调用机械臂控制接口完成分拣动作
      - 设计分类结果可视化交互界面
    notes: 源码已就位;已测试;64用例全绿;板端验证待确认

