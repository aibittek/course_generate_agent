<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 19-4 · 一次 TF 查询的全过程</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 19-4 · 一次 TF 查询的全过程</h1>
  <p class="q">本图回答的问题：<code>lookup_transform('map','laser_frame')</code> 背后做了哪三步？为什么不用手写矩阵？</p>
</div>
<svg viewBox="0 0 780 470" role="img" aria-label="TF 查询流程图">
  <defs>
    <marker id="q-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0891b2"/></marker>
    <marker id="q-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
    <marker id="q-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
    <marker id="q-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/></marker>
    <marker id="q-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e11d48"/></marker>
  </defs>

  <!-- 输入：传感器数据 -->
  <rect x="30" y="40" width="210" height="64" rx="6" fill="#fff"/>
  <rect x="30" y="40" width="210" height="64" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="135" y="66" text-anchor="middle">激光点 p (0.30, 0)</text>
  <text class="s" x="135" y="86" text-anchor="middle">frame_id: laser_frame · 带 stamp</text>

  <line x1="240" y1="72" x2="298" y2="72" stroke="var(--green)" stroke-width="1.5" marker-end="url(#q-g)"/>
  <text class="l" x="252" y="64">listener 收集</text>

  <!-- Buffer -->
  <rect x="302" y="36" width="190" height="72" rx="6" fill="#fff"/>
  <rect x="302" y="36" width="190" height="72" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="397" y="62" text-anchor="middle">Buffer · 变换缓存</text>
  <text class="s" x="397" y="82" text-anchor="middle">订阅 /tf + /tf_static</text>
  <text class="s" x="397" y="99" text-anchor="middle">默认缓存 10 秒历史</text>

  <!-- 三步查询 -->
  <rect x="302" y="152" width="190" height="56" rx="6" fill="#fff"/>
  <rect x="302" y="152" width="190" height="56" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="397" y="175" text-anchor="middle">① 沿父指针向上爬</text>
  <text class="s" x="397" y="195" text-anchor="middle">源帧一路到共同祖先</text>
  <line x1="397" y1="108" x2="397" y2="150" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#q-p)"/>
  <text class="l" x="407" y="134">lookup_transform()</text>

  <rect x="302" y="230" width="190" height="56" rx="6" fill="#fff"/>
  <rect x="302" y="230" width="190" height="56" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="397" y="253" text-anchor="middle">② 找汇合点（共同祖先）</text>
  <text class="s" x="397" y="273" text-anchor="middle">目标帧也向上爬至相遇</text>
  <line x1="397" y1="208" x2="397" y2="228" stroke="var(--green)" stroke-width="1.5" marker-end="url(#q-g)"/>

  <rect x="302" y="308" width="190" height="56" rx="6" fill="#fff"/>
  <rect x="302" y="308" width="190" height="56" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="397" y="331" text-anchor="middle">③ 该取逆的取逆，连乘</text>
  <text class="s" x="397" y="351" text-anchor="middle">拼出 A→B 的总变换</text>
  <line x1="397" y1="286" x2="397" y2="306" stroke="var(--green)" stroke-width="1.5" marker-end="url(#q-g)"/>

  <!-- 时间戳维度 -->
  <rect x="560" y="36" width="190" height="72" rx="6" fill="#fff"/>
  <rect x="560" y="36" width="190" height="72" rx="6" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1.5"/>
  <text class="t" x="655" y="62" text-anchor="middle">按数据时间戳对齐</text>
  <text class="s" x="655" y="82" text-anchor="middle">Time() = 最新</text>
  <text class="s" x="655" y="99" text-anchor="middle">传时刻 t → 历史插值</text>
  <line x1="492" y1="72" x2="558" y2="72" stroke="var(--orange)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#q-o)"/>
  <text class="l" x="498" y="64">取该时刻的边</text>

  <!-- 输出 -->
  <rect x="302" y="396" width="190" height="50" rx="6" fill="#fff"/>
  <rect x="302" y="396" width="190" height="50" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="397" y="419" text-anchor="middle">T_map←laser 结果</text>
  <text class="s" x="397" y="438" text-anchor="middle">平移 + 四元数</text>
  <line x1="397" y1="364" x2="397" y2="394" stroke="var(--green)" stroke-width="1.5" marker-end="url(#q-g)"/>

  <!-- 侧边：反解示例 -->
  <rect x="560" y="230" width="190" height="134" rx="6" fill="#fff"/>
  <rect x="560" y="230" width="190" height="134" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="655" y="255" text-anchor="middle">拿到结果怎么用</text>
  <text class="s" x="655" y="278" text-anchor="middle">tx = t.transform.translation.x</text>
  <text class="s" x="655" y="300" text-anchor="middle">yaw = 2·atan2(z, w)</text>
  <text class="s" x="655" y="322" text-anchor="middle">（半角反解，见验证题）</text>
  <text class="s" x="655" y="348" text-anchor="middle">超时用 timeout 等待</text>
  <line x1="492" y1="414" x2="558" y2="366" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#q-t)"/>
  <text class="l" x="498" y="404">消费</text>

  <!-- 风险 -->
  <line x1="302" y1="421" x2="140" y2="421" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#q-r)"/>
  <rect x="30" y="396" width="110" height="50" rx="6" fill="#fff"/>
  <rect x="30" y="396" width="110" height="50" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="85" y="417" text-anchor="middle" fill="var(--red)">树没凑齐</text>
  <text class="s" x="85" y="436" text-anchor="middle">超时 / Extrapolation</text>

  <text class="s" x="390" y="140" text-anchor="middle"></text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：三次爬树 + 连乘 = 唯一解，全程无需手写矩阵</span>
  <span class="warn">⚠️ 风险：时间戳超出缓存窗口 → 报 extrapolation 错误</span>
  <span class="evid">🔍 验证：04 节步骤 1 tf2_echo 的实测输出</span>
</div>
<div class="ft">EXP-19 · TF2 坐标系变换</div>
<script>
(function(){if(window===parent)return;function send(){try{parent.postMessage({type:'figh',h:document.body.scrollHeight},'*')}catch(e){}}window.addEventListener('load',send);window.addEventListener('resize',function(){clearTimeout(window.__fighT);window.__fighT=setTimeout(send,120)});send();})();
</script>
</body>
</html>
