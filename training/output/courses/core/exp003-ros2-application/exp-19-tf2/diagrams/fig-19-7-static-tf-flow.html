<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 19-7 · 五步实验路线</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 19-7 · 五步实验路线：从读懂一棵树到查任意两位姿</h1>
  <p class="q">本图回答的问题：五步分别针对 ros2 launch car1_description display.launch.py 的哪个部分，动手做什么、看什么输出？</p>
</div>
<svg viewBox="0 0 800 330" role="img" aria-label="五步实验流程图：理解树概念、发布静态TF、发布动态TF、可视化验证、查询相对位姿">
  <defs>
    <marker id="f-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0891b2"/></marker>
    <marker id="f-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
    <marker id="f-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
    <marker id="f-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/></marker>
    <marker id="f-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e11d48"/></marker>
    <marker id="f-gy" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker>
  </defs>

  <!-- 五个步骤 -->
  <rect x="10" y="38" width="140" height="66" rx="6" fill="#fff"/>
  <rect x="10" y="38" width="140" height="66" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="80" y="62" text-anchor="middle">① 理解树概念</text>
  <text class="s" x="80" y="82" text-anchor="middle">URDF 的 link/joint</text>
  <text class="s" x="80" y="98" text-anchor="middle">= frame/边 · node list</text>

  <line x1="150" y1="71" x2="166" y2="71" stroke="var(--gray)" stroke-width="1.5" marker-end="url(#f-gy)"/>

  <rect x="170" y="38" width="140" height="66" rx="6" fill="#fff"/>
  <rect x="170" y="38" width="140" height="66" rx="6" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1.5"/>
  <text class="t" x="240" y="62" text-anchor="middle">② 发布静态边</text>
  <text class="s" x="240" y="82" text-anchor="middle">fixed 关节 → /tf_static</text>
  <text class="s" x="240" y="98" text-anchor="middle">echo 读回 · 与 URDF 对账</text>

  <line x1="310" y1="71" x2="326" y2="71" stroke="var(--gray)" stroke-width="1.5" marker-end="url(#f-gy)"/>

  <rect x="330" y="38" width="140" height="66" rx="6" fill="#fff"/>
  <rect x="330" y="38" width="140" height="66" rx="6" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1.5"/>
  <text class="t" x="400" y="62" text-anchor="middle">③ 发布动态边</text>
  <text class="s" x="400" y="82" text-anchor="middle">拖滑块 → /joint_states</text>
  <text class="s" x="400" y="98" text-anchor="middle">→ /tf 持续刷新 hz &gt; 0</text>

  <line x1="470" y1="71" x2="486" y2="71" stroke="var(--gray)" stroke-width="1.5" marker-end="url(#f-gy)"/>

  <rect x="490" y="38" width="140" height="66" rx="6" fill="#fff"/>
  <rect x="490" y="38" width="140" height="66" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="560" y="62" text-anchor="middle">④ 可视化验证</text>
  <text class="s" x="560" y="82" text-anchor="middle">view_frames + RViz</text>
  <text class="s" x="560" y="98" text-anchor="middle">rqt_tf_tree ⟳ 点刷新</text>

  <line x1="630" y1="71" x2="646" y2="71" stroke="var(--gray)" stroke-width="1.5" marker-end="url(#f-gy)"/>

  <rect x="650" y="38" width="140" height="66" rx="6" fill="#fff"/>
  <rect x="650" y="38" width="140" height="66" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="720" y="62" text-anchor="middle">⑤ 查询相对位姿</text>
  <text class="s" x="720" y="82" text-anchor="middle">tf2_echo 父 子</text>
  <text class="s" x="720" y="98" text-anchor="middle">或 Buffer.lookup_transform</text>

  <!-- 每步看什么 -->
  <line x1="80" y1="108" x2="80" y2="130" stroke="var(--gray)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#f-gy)"/>
  <line x1="240" y1="108" x2="240" y2="130" stroke="var(--gray)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#f-gy)"/>
  <line x1="400" y1="108" x2="400" y2="130" stroke="var(--gray)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#f-gy)"/>
  <line x1="560" y1="108" x2="560" y2="130" stroke="var(--gray)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#f-gy)"/>
  <line x1="720" y1="108" x2="720" y2="130" stroke="var(--gray)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#f-gy)"/>

  <rect x="10" y="134" width="140" height="52" rx="6" fill="var(--gray-bg)" stroke="var(--border)" stroke-width="1"/>
  <text class="s" x="80" y="156" text-anchor="middle">看得见：3 节点在场</text>
  <text class="s" x="80" y="174" text-anchor="middle">整棵树轮廓认全</text>

  <rect x="170" y="134" width="140" height="52" rx="6" fill="var(--gray-bg)" stroke="var(--border)" stroke-width="1"/>
  <text class="s" x="240" y="156" text-anchor="middle">看得见：echo 数值</text>
  <text class="s" x="240" y="174" text-anchor="middle">= URDF 原值</text>

  <rect x="330" y="134" width="140" height="52" rx="6" fill="var(--gray-bg)" stroke="var(--border)" stroke-width="1"/>
  <text class="s" x="400" y="156" text-anchor="middle">看得见：拖滑块四处</text>
  <text class="s" x="400" y="174" text-anchor="middle">同动（角/tf/rviz/查边）</text>

  <rect x="490" y="134" width="140" height="52" rx="6" fill="var(--gray-bg)" stroke="var(--border)" stroke-width="1"/>
  <text class="s" x="560" y="156" text-anchor="middle">看得见：frames.pdf</text>
  <text class="s" x="560" y="174" text-anchor="middle">＋ RViz 轴与帧名</text>

  <rect x="650" y="134" width="140" height="52" rx="6" fill="var(--gray-bg)" stroke="var(--border)" stroke-width="1"/>
  <text class="s" x="720" y="156" text-anchor="middle">看得见：</text>
  <text class="l" x="720" y="174" text-anchor="middle">[0.000, 0.000, 0.029]</text>

  <!-- 风险区 -->
  <rect x="44" y="216" width="490" height="56" rx="6" fill="#fff"/>
  <rect x="44" y="216" width="490" height="56" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="289" y="239" text-anchor="middle" fill="var(--red)">两处高频错：frame 名大小写差一个字符 · target/source 顺序写反</text>
  <text class="s" x="289" y="259" text-anchor="middle">前者 Frame does not exist，后者坐标直接飞出（等于求了逆变换）</text>

  <rect x="560" y="216" width="224" height="56" rx="6" fill="#fff"/>
  <rect x="560" y="216" width="224" height="56" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="672" y="239" text-anchor="middle">调试三板斧</text>
  <text class="s" x="672" y="259" text-anchor="middle">echo 查单边 → frames 查全树 → RViz 看效果</text>

  <text class="s" x="400" y="300" text-anchor="middle">五步走完 = 单边、全树、现场三重证据齐 → 05 节验收六条逐条打勾</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：五步各有产出，末步的对账数字来自首步读过的 URDF</span>
  <span class="warn">⚠️ 风险：名字与顺序两类错都会让第 ⑤ 步查询落空</span>
  <span class="evid">🔍 验证：04 节各步命令卡逐条执行 · 05 节验收 6 条</span>
</div>
<div class="ft">EXP-19 · TF2 坐标系变换</div>

</body>
</html>
