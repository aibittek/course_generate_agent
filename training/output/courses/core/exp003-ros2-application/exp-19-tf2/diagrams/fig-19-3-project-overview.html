<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 19-3 · 工程全景</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.bnd{font:700 11px system-ui,sans-serif;fill:var(--green)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 19-3 · 工程全景：一个包、一条话题、三处验证</h1>
  <p class="q">本图回答的问题：本实验动了哪些文件和话题，谁发谁收，验证信号从哪看？</p>
</div>
<svg viewBox="0 0 800 470" role="img" aria-label="工程全景框架图">
  <defs>
    <marker id="v-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
    <marker id="v-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/></marker>
    <marker id="v-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0891b2"/></marker>
    <marker id="v-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
    <marker id="v-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e11d48"/></marker>
  </defs>

  <!-- 左上：命令入口 -->
  <rect x="30" y="30" width="250" height="56" rx="6" fill="#fff"/>
  <rect x="30" y="30" width="250" height="56" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="155" y="54" text-anchor="middle">ros2 run tf2_demo static_tf_pub</text>
  <text class="s" x="155" y="74" text-anchor="middle">终端 A · 启动发布节点</text>

  <line x1="155" y1="86" x2="155" y2="130" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#v-t)"/>
  <text class="l" x="165" y="112">启动</text>

  <!-- 节点边界 -->
  <rect x="26" y="134" width="360" height="296" rx="12" fill="none" stroke="var(--green)" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text class="bnd" x="38" y="154">节点进程 · static_tf_pub</text>

  <!-- 源码文件 -->
  <rect x="52" y="168" width="308" height="56" rx="6" fill="#fff"/>
  <rect x="52" y="168" width="308" height="56" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="206" y="191" text-anchor="middle">static_tf_pub.py</text>
  <text class="s" x="206" y="211" text-anchor="middle">frame_id=base_link · child=laser_frame</text>

  <line x1="206" y1="224" x2="206" y2="264" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#v-p)"/>
  <text class="l" x="216" y="250">构造 TransformStamped</text>

  <!-- Broadcaster -->
  <rect x="52" y="268" width="308" height="56" rx="6" fill="#fff"/>
  <rect x="52" y="268" width="308" height="56" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="206" y="291" text-anchor="middle">StaticTransformBroadcaster</text>
  <text class="s" x="206" y="311" text-anchor="middle">sendTransform(t) · 只发一次</text>

  <!-- 备选：一行命令 -->
  <rect x="52" y="352" width="308" height="60" rx="6" fill="#fff"/>
  <rect x="52" y="352" width="308" height="60" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="206" y="375" text-anchor="middle">static_transform_publisher（免代码）</text>
  <text class="s" x="206" y="396" text-anchor="middle">--x --y --z --yaw  父 子</text>
  <line x1="206" y1="350" x2="206" y2="326" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#v-t)"/>
  <text class="l" x="216" y="342">等价效果</text>

  <!-- /tf_static 话题 -->
  <line x1="26" y1="296" x2="420" y2="296" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#v-o)"/>
  <rect x="424" y="264" width="180" height="64" rx="6" fill="#fff"/>
  <rect x="424" y="264" width="180" height="64" rx="6" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1.5"/>
  <text class="t" x="514" y="289" text-anchor="middle">/tf_static 话题</text>
  <text class="s" x="514" y="309" text-anchor="middle">Transient Local · 可重放</text>
  <text class="s" x="514" y="323" text-anchor="middle">后加入者仍能收到</text>

  <!-- 验证三件套 -->
  <rect x="640" y="30" width="140" height="56" rx="6" fill="#fff"/>
  <rect x="640" y="30" width="140" height="56" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="710" y="54" text-anchor="middle">tf2_echo</text>
  <text class="s" x="710" y="74" text-anchor="middle">查单条边的数值</text>

  <rect x="640" y="120" width="140" height="56" rx="6" fill="#fff"/>
  <rect x="640" y="120" width="140" height="56" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="710" y="144" text-anchor="middle">view_frames</text>
  <text class="s" x="710" y="164" text-anchor="middle">导出整棵树 PDF</text>

  <rect x="640" y="210" width="140" height="56" rx="6" fill="#fff"/>
  <rect x="640" y="210" width="140" height="56" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="710" y="234" text-anchor="middle">rviz2 · TF Display</text>
  <text class="s" x="710" y="254" text-anchor="middle">看轴向与箭头</text>

  <line x1="604" y1="286" x2="636" y2="246" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#v-o)"/>
  <line x1="604" y1="296" x2="636" y2="164" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#v-o)"/>
  <line x1="604" y1="310" x2="636" y2="80" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#v-o)"/>
  <text class="l" x="612" y="196" transform="rotate(-78 612 196)">订阅 /tf_static</text>

  <!-- 风险 -->
  <rect x="424" y="366" width="356" height="60" rx="6" fill="#fff"/>
  <rect x="424" y="366" width="356" height="60" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="602" y="390" text-anchor="middle" fill="var(--red)">名字/顺序任一处写错 → 查不到</text>
  <text class="s" x="602" y="410" text-anchor="middle">laser_Frame 大小写 · target/source 写反 · 未 source</text>
  <line x1="514" y1="328" x2="514" y2="364" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#v-r)"/>
  <text class="l" x="524" y="352" fill="var(--red)">对不上</text>

  <text class="s" x="400" y="456" text-anchor="middle">发布只管一条边，查证交给三件工具——谁都不用维护全树</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：一个节点发一条边，/tf_static 供所有工具复读</span>
  <span class="warn">⚠️ 风险：frame 名大小写、父子顺序、未 source 三类高频错</span>
  <span class="evid">🔍 验证：04 节步骤 1~3 的三件套实测</span>
</div>
<div class="ft">EXP-19 · TF2 坐标系变换</div>
</body>
</html>
