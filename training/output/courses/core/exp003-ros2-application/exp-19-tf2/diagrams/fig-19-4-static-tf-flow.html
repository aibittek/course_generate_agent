<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 19-4 · 静态变换的发布与验证流程</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 19-4 · 静态变换：从建包到三重验证</h1>
  <p class="q">本图回答的问题：写一条 <code>base_link → laser_frame</code> 静态边，中间有哪些必经步骤、各自看什么输出？</p>
</div>
<svg viewBox="0 0 800 330" role="img" aria-label="静态变换发布验证流程图">
  <defs>
    <marker id="f-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0891b2"/></marker>
    <marker id="f-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
    <marker id="f-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
    <marker id="f-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/></marker>
    <marker id="f-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e11d48"/></marker>
  </defs>

  <!-- 起点 -->
  <rect x="20" y="46" width="140" height="46" rx="23" fill="#fff"/>
  <rect x="20" y="46" width="140" height="46" rx="23" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="90" y="68" text-anchor="middle">ros2 pkg create</text>
  <text class="s" x="90" y="86" text-anchor="middle">tf2_demo · ament_python</text>

  <line x1="160" y1="69" x2="200" y2="69" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#f-t)"/>
  <text class="l" x="170" y="60">①</text>

  <!-- 写代码 -->
  <rect x="204" y="36" width="170" height="66" rx="6" fill="#fff"/>
  <rect x="204" y="36" width="170" height="66" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="289" y="60" text-anchor="middle">写 static_tf_pub.py</text>
  <text class="s" x="289" y="80" text-anchor="middle">StaticTfPub 节点</text>
  <text class="s" x="289" y="96" text-anchor="middle">+ entry_points 注册</text>

  <line x1="374" y1="69" x2="414" y2="69" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#f-p)"/>
  <text class="l" x="384" y="60">②</text>

  <!-- 构建 -->
  <rect x="418" y="36" width="166" height="66" rx="6" fill="#fff"/>
  <rect x="418" y="36" width="166" height="66" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="501" y="60" text-anchor="middle">colcon build + source</text>
  <text class="s" x="501" y="80" text-anchor="middle">--packages-select</text>
  <text class="s" x="501" y="96" text-anchor="middle">. install/setup.bash</text>

  <line x1="584" y1="69" x2="624" y2="69" stroke="var(--green)" stroke-width="1.5" marker-end="url(#f-g)"/>
  <text class="l" x="594" y="60">③</text>

  <!-- 发布 -->
  <rect x="628" y="36" width="156" height="66" rx="6" fill="#fff"/>
  <rect x="628" y="36" width="156" height="66" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="706" y="60" text-anchor="middle">ros2 run</text>
  <text class="s" x="706" y="80" text-anchor="middle">tf2_demo static_tf_pub</text>
  <text class="s" x="706" y="96" text-anchor="middle">只发这一条静态边</text>

  <!-- 发布到话题 -->
  <line x1="706" y1="102" x2="706" y2="146" stroke="var(--green)" stroke-width="1.5" marker-end="url(#f-g)"/>
  <rect x="628" y="150" width="156" height="50" rx="6" fill="#fff"/>
  <rect x="628" y="150" width="156" height="50" rx="6" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1.5"/>
  <text class="t" x="706" y="173" text-anchor="middle">/tf_static</text>
  <text class="s" x="706" y="192" text-anchor="middle">msg: TransformStamped</text>

  <!-- 三重验证 -->
  <line x1="626" y1="175" x2="566" y2="175" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#f-o)"/>
  <text class="l" x="576" y="166">④ 验证</text>

  <rect x="404" y="150" width="160" height="50" rx="6" fill="#fff"/>
  <rect x="404" y="150" width="160" height="50" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="484" y="173" text-anchor="middle">tf2_echo</text>
  <text class="s" x="484" y="192" text-anchor="middle">Translation [0.1,0,0.2]</text>

  <rect x="204" y="150" width="160" height="50" rx="6" fill="#fff"/>
  <rect x="204" y="150" width="160" height="50" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="284" y="173" text-anchor="middle">view_frames</text>
  <text class="s" x="284" y="192" text-anchor="middle">frames.pdf 树形合法</text>
  <line x1="402" y1="175" x2="368" y2="175" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#f-t)"/>

  <rect x="20" y="150" width="140" height="50" rx="6" fill="#fff"/>
  <rect x="20" y="150" width="140" height="50" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="90" y="173" text-anchor="middle">rviz2 TF</text>
  <text class="s" x="90" y="192" text-anchor="middle">轴向与箭头核对</text>
  <line x1="202" y1="175" x2="164" y2="175" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#f-t)"/>

  <!-- 风险区 -->
  <line x1="289" y1="102" x2="289" y2="256" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#f-r)"/>
  <rect x="44" y="260" width="490" height="56" rx="6" fill="#fff"/>
  <rect x="44" y="260" width="490" height="56" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="289" y="283" text-anchor="middle" fill="var(--red)">两处高频错：frame 名大小写差一个字符 · target/source 顺序写反</text>
  <text class="s" x="289" y="303" text-anchor="middle">前者 Frame does not exist，后者坐标直接飞出（等于求了逆变换）</text>

  <rect x="560" y="260" width="224" height="56" rx="6" fill="#fff"/>
  <rect x="560" y="260" width="224" height="56" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="672" y="283" text-anchor="middle">调试三板斧</text>
  <text class="s" x="672" y="303" text-anchor="middle">echo 查单边 → frames 查全树 → RViz 看效果</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：④ 任一步输出对得上，静态边即生效</span>
  <span class="warn">⚠️ 风险：名字与顺序两类错都会让查询落空</span>
  <span class="evid">🔍 验证：04 节验收清单 6 条逐条打勾</span>
</div>
<div class="ft">EXP-19 · TF2 坐标系变换</div>
</body>
</html>
