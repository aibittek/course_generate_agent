<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 11-4 · 节点主流程</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.ln{font:600 11px ui-monospace,Consolas,monospace;fill:var(--text)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 11-4 · 节点主流程：一次采样如何从触发走到发布</h1>
  <p class="q">本图回答的问题：定时器回调里哪一行取时刻、哪一行盖章，没有 spin 会怎样？</p>
</div>
<svg viewBox="0 0 760 640" role="img" aria-label="节点主流程图">
  <!-- 起 -->
  <rect x="290" y="20" width="180" height="42" rx="21" fill="#fff"/>
  <rect x="290" y="20" width="180" height="42" rx="21" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="380" y="46" text-anchor="middle">__init__：建两个定时器</text>
  <line x1="380" y1="62" x2="380" y2="92" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#at)"/>

  <!-- 判断 spin -->
  <polygon points="380,96 505,130 380,164 255,130" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="380" y="127" text-anchor="middle">rclpy.spin 在运行？</text>
  <text class="s" x="380" y="145" text-anchor="middle">事件循环检测到点</text>

  <!-- 否分支 -->
  <line x1="505" y1="130" x2="588" y2="130" stroke="var(--red)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="l" x="530" y="122">否</text>
  <rect x="590" y="104" width="150" height="54" rx="6" fill="#fff"/>
  <rect x="590" y="104" width="150" height="54" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.5"/>
  <text class="t" x="665" y="127" text-anchor="middle">回调永不触发</text>
  <text class="s" x="665" y="145" text-anchor="middle">节点"假死"</text>

  <!-- 是分支 -->
  <line x1="380" y1="164" x2="380" y2="196" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag)"/>
  <text class="l" x="390" y="184">是 · 到点</text>

  <!-- 分流判断：哪个定时器 -->
  <polygon points="380,200 470,232 380,264 290,232" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="380" y="237" text-anchor="middle">哪个定时器？</text>

  <!-- 左：timer1 采样 -->
  <text class="l" x="180" y="292" text-anchor="middle">timer1 · 1.0s</text>
  <line x1="330" y1="248" x2="196" y2="296" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="90" y="300" width="215" height="76" rx="6" fill="#fff"/>
  <rect x="90" y="300" width="215" height="76" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="ln" x="197" y="324" text-anchor="middle">① now = get_clock()</text>
  <text class="ln" x="197" y="342" text-anchor="middle">     .now()</text>
  <text class="s" x="197" y="363" text-anchor="middle">采集时刻 · 就在这里取</text>
  <line x1="197" y1="376" x2="197" y2="404" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag)"/>

  <rect x="90" y="406" width="215" height="64" rx="6" fill="#fff"/>
  <rect x="90" y="406" width="215" height="64" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="ln" x="197" y="430" text-anchor="middle">② now_msg = now.to_msg()</text>
  <text class="s" x="197" y="452" text-anchor="middle">API Time → 消息 Time</text>
  <line x1="197" y1="470" x2="197" y2="498" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#ap)"/>

  <rect x="90" y="500" width="215" height="64" rx="6" fill="#fff"/>
  <rect x="90" y="500" width="215" height="64" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="197" y="524" text-anchor="middle">③ stamp 盖戳 → 发布</text>
  <text class="s" x="197" y="546" text-anchor="middle">publish(/sensor_data)</text>
  <line x1="305" y1="532" x2="600" y2="588" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#at)"/>
  <text class="l" x="448" y="552">日志 + 计数</text>

  <!-- 回环 -->
  <rect x="604" y="566" width="130" height="44" rx="6" fill="#fff"/>
  <rect x="604" y="566" width="130" height="44" rx="6" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5"/>
  <text class="t" x="669" y="593" text-anchor="middle">等待下一周期</text>
  <path d="M 604 588 C 540 626, 300 634, 120 620 C 60 612, 52 560, 88 534" fill="none" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#agr)"/>

  <!-- 右：timer2 摘要 -->
  <text class="l" x="560" y="292" text-anchor="middle">timer2 · 5.0s</text>
  <line x1="430" y1="248" x2="544" y2="296" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="470" y="300" width="215" height="64" rx="6" fill="#fff"/>
  <rect x="470" y="300" width="215" height="64" rx="6" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5"/>
  <text class="t" x="577" y="326" text-anchor="middle">读 now().nanoseconds</text>
  <text class="s" x="577" y="348" text-anchor="middle">累计次数 + 总纳秒 → 日志</text>
  <line x1="577" y1="364" x2="640" y2="564" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#agr)"/>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--green)"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--purple)"/></marker>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--teal)"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--red)"/></marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--gray)"/></marker>
  </defs>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：时刻取在①采集行，盖章在③，两步之间不做耗时操作</span>
  <span class="warn">⚠️ 风险：忘 spin → 全部回调不触发；同线程串行，一个堵全堵</span>
  <span class="evid">🔍 验证：02 节 hz≈1.000；04 节逐行代码与终端输出</span>
</div>
<div class="ft">EXP-11 · 时间 API 与双时钟体系</div>
</body>
</html>
