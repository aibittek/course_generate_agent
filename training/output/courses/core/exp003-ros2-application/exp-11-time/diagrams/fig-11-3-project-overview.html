<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 11-3 · 工程全景</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.bnd{font:700 11px system-ui,sans-serif;fill:var(--green)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 11-3 · 本实验的工程全景：源码、话题、终端</h1>
  <p class="q">本图回答的问题：这节课到底动了哪些文件和话题，数据从哪流到哪？</p>
</div>
<svg viewBox="0 0 780 430" role="img" aria-label="工程全景框架图">
  <!-- 上游依赖 -->
  <rect x="40" y="30" width="180" height="48" rx="6" fill="#fff"/>
  <rect x="40" y="30" width="180" height="48" rx="6" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="130" y="52" text-anchor="middle">common.py</text>
  <text class="s" x="130" y="69" text-anchor="middle">读 MQ5（同目录 import）</text>

  <rect x="540" y="30" width="200" height="48" rx="6" fill="#fff"/>
  <rect x="540" y="30" width="200" height="48" rx="6" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="640" y="52" text-anchor="middle">Gazebo / rosbag play</text>
  <text class="s" x="640" y="69" text-anchor="middle">外部系统 · 仅仿真/回放</text>

  <!-- 节点边界 -->
  <rect x="36" y="104" width="420" height="296" rx="12" fill="none" stroke="var(--green)" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text class="bnd" x="48" y="124">节点进程 · time_demo_node.py</text>

  <!-- 定时器1 -->
  <rect x="60" y="140" width="175" height="54" rx="6" fill="#fff"/>
  <rect x="60" y="140" width="175" height="54" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="147" y="164" text-anchor="middle">定时器1 · 1Hz 采样</text>
  <text class="s" x="147" y="182" text-anchor="middle">create_timer(1.0, cb)</text>

  <!-- 定时器2 -->
  <rect x="256" y="140" width="175" height="54" rx="6" fill="#fff"/>
  <rect x="256" y="140" width="175" height="54" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="343" y="164" text-anchor="middle">定时器2 · 5s 摘要</text>
  <text class="s" x="343" y="182" text-anchor="middle">create_timer(5.0, cb)</text>

  <!-- Clock -->
  <rect x="256" y="236" width="175" height="54" rx="6" fill="#fff"/>
  <rect x="256" y="236" width="175" height="54" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="343" y="260" text-anchor="middle">Clock · 取时刻</text>
  <text class="s" x="343" y="278" text-anchor="middle">get_clock().now()</text>

  <!-- 盖戳发布 -->
  <rect x="60" y="236" width="175" height="54" rx="6" fill="#fff"/>
  <rect x="60" y="236" width="175" height="54" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="147" y="260" text-anchor="middle">to_msg() 盖 stamp</text>
  <text class="s" x="147" y="278" text-anchor="middle">→ publish(Header)</text>

  <!-- 摘要日志 -->
  <rect x="256" y="330" width="175" height="50" rx="6" fill="#fff"/>
  <rect x="256" y="330" width="175" height="50" rx="6" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5"/>
  <text class="t" x="343" y="352" text-anchor="middle">状态摘要日志</text>
  <text class="s" x="343" y="370" text-anchor="middle">累计次数 + 总纳秒</text>

  <!-- 内部流 -->
  <line x1="147" y1="194" x2="147" y2="234" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag)"/>
  <text class="l" x="156" y="218">到点</text>
  <line x1="343" y1="194" x2="343" y2="234" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag)"/>
  <text class="l" x="352" y="218">到点</text>
  <line x1="256" y1="266" x2="237" y2="266" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#ap)"/>
  <text class="l" x="240" y="258" text-anchor="middle">now()</text>
  <line x1="343" y1="290" x2="343" y2="328" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- 依赖 → 节点 -->
  <line x1="150" y1="78" x2="150" y2="138" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#agr)"/>
  <text class="l" x="160" y="112">import</text>

  <!-- 外部 → /clock → Clock -->
  <rect x="540" y="140" width="200" height="50" rx="6" fill="#fff"/>
  <rect x="540" y="140" width="200" height="50" rx="6" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1.5"/>
  <text class="t" x="640" y="163" text-anchor="middle">/sensor_data 话题</text>
  <text class="s" x="640" y="181" text-anchor="middle">Header { stamp, frame_id }</text>
  <line x1="431" y1="263" x2="538" y2="180" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#at)"/>
  <text class="l" x="492" y="228">publish</text>

  <line x1="640" y1="78" x2="640" y2="138" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#agr)"/>
  <text class="l" x="650" y="112">/clock ·仿真时</text>
  <line x1="540" y1="176" x2="433" y2="264" stroke="var(--orange)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ao)"/>

  <!-- 终端B -->
  <rect x="470" y="250" width="270" height="130" rx="6" fill="#fff"/>
  <rect x="470" y="250" width="270" height="130" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="605" y="282" text-anchor="middle">终端 B · 测量工具</text>
  <text class="s" x="605" y="306" text-anchor="middle">ros2 topic echo — 看 stamp</text>
  <text class="s" x="605" y="328" text-anchor="middle">ros2 topic hz — 验节拍</text>
  <text class="s" x="605" y="350" text-anchor="middle">ros2 topic delay — 测延迟</text>
  <line x1="640" y1="190" x2="640" y2="248" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#ao)"/>
  <text class="l" x="650" y="224">订阅</text>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--green)"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--purple)"/></marker>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--teal)"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--orange)"/></marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--gray)"/></marker>
  </defs>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：一个节点、两个定时器、时间全部经 Clock 一个出口</span>
  <span class="warn">⚠️ 风险：虚线依赖（common.py、Gazebo）缺一则对应功能不可用</span>
  <span class="evid">🔍 验证：02 节三条命令实测 echo/hz/delay</span>
</div>
<div class="ft">EXP-11 · 时间 API 与双时钟体系</div>
</body>
</html>
