<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 18-2 · nav2 三层聚合结构</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.lyr{font:700 11.5px system-ui,sans-serif;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 18-2 · navigation2 的三层聚合结构</h1>
  <p class="q">本图回答的问题：二十多个子包为什么拆成三层，依赖箭头分别指向哪一层？</p>
</div>
<svg viewBox="0 0 780 470" role="img" aria-label="nav2 三层结构框架图">
  <defs>
    <marker id="b-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
    <marker id="b-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
    <marker id="b-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker>
    <marker id="b-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e11d48"/></marker>
  </defs>

  <!-- 第 1 层 -->
  <rect x="40" y="30" width="700" height="96" rx="10" fill="#fff" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="lyr" x="52" y="50" fill="var(--purple)">第 1 层 · 门面（依赖清单数据）</text>
  <rect x="230" y="62" width="320" height="50" rx="6" fill="#fff"/>
  <rect x="230" y="62" width="320" height="50" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="390" y="84" text-anchor="middle">navigation2（元功能包）</text>
  <text class="s" x="390" y="103" text-anchor="middle">零代码 · 只有 exec_depend · 没人依赖它</text>

  <!-- 层间箭头 1 → 2 -->
  <line x1="390" y1="126" x2="390" y2="166" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#b-p)"/>
  <text class="l" x="402" y="146">exec_depend（运行时我要它们）</text>

  <!-- 第 2 层 -->
  <rect x="40" y="170" width="700" height="124" rx="10" fill="#fff" stroke="var(--green)" stroke-width="1.5"/>
  <text class="lyr" x="52" y="190" fill="var(--green)">第 2 层 · 实现（功能处理）</text>
  <rect x="70" y="206" width="200" height="72" rx="6" fill="#fff"/>
  <rect x="70" y="206" width="200" height="72" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="170" y="232" text-anchor="middle">规划 / 控制 / 定位</text>
  <text class="s" x="170" y="250" text-anchor="middle">nav2_planner · controller</text>
  <text class="s" x="170" y="267" text-anchor="middle">nav2_amcl</text>

  <rect x="290" y="206" width="200" height="72" rx="6" fill="#fff"/>
  <rect x="290" y="206" width="200" height="72" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="390" y="232" text-anchor="middle">地图 / 行为树</text>
  <text class="s" x="390" y="250" text-anchor="middle">nav2_map_server</text>
  <text class="s" x="390" y="267" text-anchor="middle">nav2_bt_navigator</text>

  <rect x="510" y="206" width="200" height="72" rx="6" fill="#fff"/>
  <rect x="510" y="206" width="200" height="72" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="610" y="232" text-anchor="middle">代价地图 / 恢复</text>
  <text class="s" x="610" y="250" text-anchor="middle">nav2_costmap_2d</text>
  <text class="s" x="610" y="267" text-anchor="middle">等 20 余个</text>

  <!-- 层间箭头 2 → 3 -->
  <line x1="390" y1="294" x2="390" y2="334" stroke="var(--green)" stroke-width="1.5" marker-end="url(#b-g)"/>
  <text class="l" x="402" y="314">build_depend / depend（编译要接口）</text>

  <!-- 第 3 层 -->
  <rect x="40" y="338" width="700" height="96" rx="10" fill="#fff" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text class="lyr" x="52" y="358">第 3 层 · 公共地基（接口与工具）</text>
  <rect x="80" y="372" width="190" height="48" rx="6" fill="#fff"/>
  <rect x="80" y="372" width="190" height="48" rx="6" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5"/>
  <text class="t" x="175" y="394" text-anchor="middle">nav2_msgs</text>
  <text class="s" x="175" y="412" text-anchor="middle">消息/服务/动作定义</text>

  <rect x="295" y="372" width="190" height="48" rx="6" fill="#fff"/>
  <rect x="295" y="372" width="190" height="48" rx="6" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5"/>
  <text class="t" x="390" y="394" text-anchor="middle">nav2_core</text>
  <text class="s" x="390" y="412" text-anchor="middle">插件基类（纯虚接口）</text>

  <rect x="510" y="372" width="190" height="48" rx="6" fill="#fff"/>
  <rect x="510" y="372" width="190" height="48" rx="6" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5"/>
  <text class="t" x="605" y="394" text-anchor="middle">nav2_common</text>
  <text class="s" x="605" y="412" text-anchor="middle">CMake 宏与工具函数</text>

  <!-- 风险：反向依赖 -->
  <line x1="610" y1="372" x2="470" y2="282" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#b-red)" opacity=".9"/>
  <text class="l" x="500" y="330" fill="var(--red)">✗ 子包反向依赖元包 = 循环依赖</text>

  <text class="s" x="390" y="452" text-anchor="middle">依赖方向自上而下 · 编译顺序自下而上（被依赖的先编）</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：第 1 层管安装、第 2 层管功能、第 3 层管接口</span>
  <span class="warn">⚠️ 风险：任何子包 depend 元包都会形成环，colcon 直接报错</span>
  <span class="evid">🔍 验证：04 节解剖 nav2_planner 的 depend 标签</span>
</div>
<div class="ft">EXP-18 · 元功能包与依赖聚合</div>
</body>
</html>
