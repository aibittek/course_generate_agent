<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 18-1 · 一条 apt 命令拉起全家桶</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.bnd{font:700 11px system-ui,sans-serif;fill:var(--purple)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 18-1 · 一条 apt 命令如何拉起整棵子包树</h1>
  <p class="q">本图回答的问题：<code>sudo apt install ros-humble-navigation2</code> 执行后，包管理器按什么顺序装了谁？</p>
</div>
<svg viewBox="0 0 780 460" role="img" aria-label="apt 聚合安装框架图">
  <defs>
    <marker id="ap-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0891b2"/></marker>
    <marker id="ap-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
    <marker id="ap-e" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
    <marker id="ap-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e11d48"/></marker>
    <marker id="ap-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker>
  </defs>

  <!-- 第 1 层：入口命令 -->
  <rect x="240" y="24" width="300" height="44" rx="6" fill="#fff"/>
  <rect x="240" y="24" width="300" height="44" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="390" y="44" text-anchor="middle">sudo apt install ...-navigation2</text>
  <text class="s" x="390" y="61" text-anchor="middle">安装入口 · 终端命令</text>

  <!-- 第 2 层：元包 -->
  <rect x="220" y="116" width="340" height="58" rx="6" fill="#fff"/>
  <rect x="220" y="116" width="340" height="58" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="390" y="140" text-anchor="middle">navigation2 · 元功能包</text>
  <text class="s" x="390" y="160" text-anchor="middle">package.xml：20 余行 exec_depend</text>
  <line x1="390" y1="68" x2="390" y2="114" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#ap-t)"/>
  <text class="l" x="400" y="94">定位元包</text>

  <!-- 第 3 层：子包两行 -->
  <g>
    <rect x="40" y="216" width="150" height="50" rx="6" fill="#fff"/>
    <rect x="40" y="216" width="150" height="50" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
    <text class="t" x="115" y="238" text-anchor="middle">nav2_planner</text>
    <text class="s" x="115" y="256" text-anchor="middle">路径规划</text>

    <rect x="220" y="216" width="150" height="50" rx="6" fill="#fff"/>
    <rect x="220" y="216" width="150" height="50" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
    <text class="t" x="295" y="238" text-anchor="middle">nav2_controller</text>
    <text class="s" x="295" y="256" text-anchor="middle">轨迹跟踪</text>

    <rect x="400" y="216" width="150" height="50" rx="6" fill="#fff"/>
    <rect x="400" y="216" width="150" height="50" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
    <text class="t" x="475" y="238" text-anchor="middle">nav2_amcl</text>
    <text class="s" x="475" y="256" text-anchor="middle">粒子滤波定位</text>

    <rect x="580" y="216" width="160" height="50" rx="6" fill="#fff"/>
    <rect x="580" y="216" width="160" height="50" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
    <text class="t" x="660" y="238" text-anchor="middle">nav2_map_server</text>
    <text class="s" x="660" y="256" text-anchor="middle">地图服务</text>
  </g>

  <!-- 扇出连线 -->
  <line x1="300" y1="174" x2="115" y2="212" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#ap-p)"/>
  <line x1="370" y1="174" x2="295" y2="212" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#ap-p)"/>
  <line x1="410" y1="174" x2="475" y2="212" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#ap-p)"/>
  <line x1="480" y1="174" x2="660" y2="212" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#ap-p)"/>
  <text class="l" x="150" y="200">exec_depend × 20+</text>

  <!-- 第 4 层：递归解析与包管理器 -->
  <rect x="60" y="320" width="240" height="54" rx="6" fill="#fff"/>
  <rect x="60" y="320" width="240" height="54" rx="6" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="180" y="344" text-anchor="middle">apt / dpkg 递归解析</text>
  <text class="s" x="180" y="363" text-anchor="middle">外部系统 · 解依赖树</text>
  <line x1="290" y1="266" x2="240" y2="316" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ap-e)"/>
  <text class="l" x="300" y="296">提交清单</text>

  <rect x="440" y="320" width="270" height="54" rx="6" fill="#fff"/>
  <rect x="440" y="320" width="270" height="54" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="575" y="344" text-anchor="middle">整棵子包树安装完成</text>
  <text class="s" x="575" y="363" text-anchor="middle">ros2 run 全部可用</text>
  <line x1="300" y1="352" x2="438" y2="352" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ap-e)"/>
  <text class="l" x="330" y="344">递归拉起</text>

  <!-- 风险分支 -->
  <rect x="60" y="404" width="330" height="44" rx="6" fill="#fff"/>
  <rect x="60" y="404" width="330" height="44" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="225" y="424" text-anchor="middle" fill="var(--red)">漏装子包 → ModuleNotFoundError</text>
  <text class="s" x="225" y="441" text-anchor="middle">手敲 apt 才会触发的风险分支</text>
  <line x1="180" y1="374" x2="180" y2="402" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ap-r)"/>
  <text class="l" x="190" y="394" fill="var(--red)">绕过元包手敲</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：元包只提供清单，安装展开由包管理器递归完成</span>
  <span class="warn">⚠️ 风险：绕过元包手敲子包名，漏一个就运行期报错</span>
  <span class="evid">🔍 验证：04 节步骤 ④ ros2 pkg xml 的回读输出</span>
</div>
<div class="ft">EXP-18 · 元功能包与依赖聚合</div>
</body>
</html>
