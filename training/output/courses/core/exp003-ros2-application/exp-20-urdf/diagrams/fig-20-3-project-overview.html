<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 20-3 · 工程全景</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.bnd{font:700 11px system-ui,sans-serif;fill:var(--green)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
html.embedded .hd,html.embedded .dock,html.embedded .ft{display:none}
</style>
<script>if(window.self!==window.top)document.documentElement.className+=' embedded';</script>
</head>
<body>
<div class="hd">
  <h1>图 20-3 · 工程全景：一个模型文件、三个节点、两把工具</h1>
  <p class="q">本图回答的问题：本实验改哪些文件、launch 起哪几个节点、用什么验证？</p>
</div>
<svg viewBox="0 0 800 480" role="img" aria-label="工程全景框架图">
  <defs>
    <marker id="v-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
    <marker id="v-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/></marker>
    <marker id="v-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0891b2"/></marker>
    <marker id="v-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
    <marker id="v-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e11d48"/></marker>
  </defs>

  <!-- 层1 文件 -->
  <rect x="24" y="26" width="752" height="100" rx="10" fill="none" stroke="var(--purple)" stroke-width="1" stroke-dasharray="8,4"/>
  <text class="bnd" x="36" y="46" fill="var(--purple)">层 1 · 模型与配置文件（urdf_demo 包）</text>

  <rect x="44" y="58" width="170" height="52" rx="6" fill="#fff"/>
  <rect x="44" y="58" width="170" height="52" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="129" y="80" text-anchor="middle">diff_drive_robot.urdf</text>
  <text class="s" x="129" y="100" text-anchor="middle">link×4 · joint×3</text>

  <rect x="234" y="58" width="170" height="52" rx="6" fill="#fff"/>
  <rect x="234" y="58" width="170" height="52" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="319" y="80" text-anchor="middle">.urdf.xacro</text>
  <text class="s" x="319" y="100" text-anchor="middle">property + macro</text>

  <rect x="424" y="58" width="170" height="52" rx="6" fill="#fff"/>
  <rect x="424" y="58" width="170" height="52" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="509" y="80" text-anchor="middle">display.launch.py</text>
  <text class="s" x="509" y="100" text-anchor="middle">注入 robot_description</text>

  <rect x="614" y="58" width="142" height="52" rx="6" fill="#fff"/>
  <rect x="614" y="58" width="142" height="52" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="685" y="80" text-anchor="middle">urdf_demo.rviz</text>
  <text class="s" x="685" y="100" text-anchor="middle">Fixed Frame 等预设</text>

  <!-- 层2 处理 -->
  <rect x="24" y="156" width="752" height="112" rx="10" fill="none" stroke="var(--green)" stroke-width="1" stroke-dasharray="8,4"/>
  <text class="bnd" x="36" y="176">层 2 · 展开与运行（处理/计算）</text>

  <rect x="44" y="190" width="170" height="58" rx="6" fill="#fff"/>
  <rect x="44" y="190" width="170" height="58" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="129" y="214" text-anchor="middle">Xacro 参数化重构</text>
  <text class="s" x="129" y="236" text-anchor="middle">80 行展开为 150 行 URDF</text>

  <rect x="300" y="190" width="210" height="58" rx="6" fill="#fff"/>
  <rect x="300" y="190" width="210" height="58" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="405" y="214" text-anchor="middle">三节点 launch</text>
  <text class="s" x="405" y="236" text-anchor="middle">jsp_gui + robot_state_publisher + rviz2</text>

  <rect x="586" y="190" width="170" height="58" rx="6" fill="#fff"/>
  <rect x="586" y="190" width="170" height="58" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="671" y="214" text-anchor="middle">RViz2 渲染</text>
  <text class="s" x="671" y="236" text-anchor="middle">RobotModel + TF Display</text>

  <!-- 文件到处理的连线 -->
  <line x1="319" y1="112" x2="150" y2="188" stroke="var(--green)" stroke-width="1.5" marker-end="url(#v-g)"/>
  <text class="l" x="215" y="152">xacro 展开</text>
  <line x1="129" y1="112" x2="129" y2="188" stroke="var(--purple)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#v-p)"/>
  <text class="l" x="60" y="156">展开产物</text>
  <line x1="509" y1="112" x2="445" y2="188" stroke="var(--green)" stroke-width="1.5" marker-end="url(#v-g)"/>
  <text class="l" x="470" y="152">ros2 launch</text>
  <line x1="470" y1="112" x2="716" y2="248" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#v-t)"/>
  <text class="l" x="628" y="160">-d 加载预设</text>

  <!-- 话题连线（层2 内部） -->
  <line x1="510" y1="219" x2="584" y2="219" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#v-o)"/>
  <text class="l" x="502" y="210" text-anchor="end">/tf · /joint_states</text>

  <!-- 层3 验证 -->
  <rect x="24" y="296" width="752" height="104" rx="10" fill="none" stroke="var(--teal)" stroke-width="1" stroke-dasharray="8,4"/>
  <text class="bnd" x="36" y="316" fill="var(--teal)">层 3 · 两把工具 + 眼睛验证</text>

  <rect x="60" y="330" width="200" height="52" rx="6" fill="#fff"/>
  <rect x="60" y="330" width="200" height="52" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="160" y="352" text-anchor="middle">check_urdf</text>
  <text class="s" x="160" y="372" text-anchor="middle">语法+结构：3 child(ren)</text>

  <rect x="300" y="330" width="200" height="52" rx="6" fill="#fff"/>
  <rect x="300" y="330" width="200" height="52" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="400" y="352" text-anchor="middle">urdf_to_graphiz</text>
  <text class="s" x="400" y="372" text-anchor="middle">拓扑图 PDF 肉眼核对</text>

  <rect x="540" y="330" width="200" height="52" rx="6" fill="#fff"/>
  <rect x="540" y="330" width="200" height="52" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="640" y="352" text-anchor="middle">RViz2 眼睛看</text>
  <text class="s" x="640" y="372" text-anchor="middle">车模·TF 轴·Collision 线框</text>

  <line x1="129" y1="112" x2="120" y2="328" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#v-t)"/>
  <text class="l" x="46" y="250">被检对象</text>
  <line x1="671" y1="250" x2="646" y2="328" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#v-t)"/>
  <text class="l" x="700" y="290">渲染结果即证据</text>

  <!-- 风险 -->
  <rect x="24" y="414" width="752" height="50" rx="6" fill="#fff"/>
  <rect x="24" y="414" width="752" height="50" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="400" y="436" text-anchor="middle" fill="var(--red)">未 source install/setup.bash · launch 硬编码 src/ 绝对路径 · Fixed Frame 写错</text>
  <text class="s" x="400" y="455" text-anchor="middle">任一处都会让整条链断在层 2——路径永远走 get_package_share_directory()</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：一份模型文件既喂三节点渲染，也喂两把工具体检</span>
  <span class="warn">⚠️ 风险：未 source / 硬编码路径 / Fixed Frame 写错 → 全链断</span>
  <span class="evid">🔍 验证：04 节检验工具三件套的三条真实输出</span>
</div>
<div class="ft">EXP-20 · URDF 与 Xacro 机器人建模</div>
</body>
</html>
