<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 20-2 · 两发布者协作数据流</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 20-2 · 两发布者合力把车"画"出来</h1>
  <p class="q">本图回答的问题：从一份静态 XML 到屏幕上会动的小车，中间有谁在发、谁在收？</p>
</div>
<svg viewBox="0 0 800 420" role="img" aria-label="两发布者数据流">
  <defs>
    <marker id="v-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
    <marker id="v-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ea580c"/></marker>
    <marker id="v-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0891b2"/></marker>
    <marker id="v-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
    <marker id="v-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e11d48"/></marker>
  </defs>

  <!-- URDF 源 -->
  <rect x="30" y="160" width="180" height="78" rx="6" fill="#fff"/>
  <rect x="30" y="160" width="180" height="78" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="120" y="190" text-anchor="middle">URDF 模型</text>
  <text class="s" x="120" y="211" text-anchor="middle">robot_description</text>
  <text class="s" x="120" y="228" text-anchor="middle">静态结构：轮装在哪</text>

  <!-- jsp_gui -->
  <rect x="330" y="288" width="210" height="70" rx="6" fill="#fff"/>
  <rect x="330" y="288" width="210" height="70" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="435" y="316" text-anchor="middle">joint_state_publisher_gui</text>
  <text class="s" x="435" y="340" text-anchor="middle">拖滑块 → 发布关节角</text>

  <!-- rsp -->
  <rect x="330" y="60" width="210" height="70" rx="6" fill="#fff"/>
  <rect x="330" y="60" width="210" height="70" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="435" y="88" text-anchor="middle">robot_state_publisher</text>
  <text class="s" x="435" y="112" text-anchor="middle">URDF × 关节角 → 算 TF</text>

  <!-- URDF → rsp 参数注入 -->
  <line x1="180" y1="185" x2="328" y2="110" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#v-p)"/>
  <text class="l" x="205" y="135">robot_description 参数注入</text>

  <!-- gui → rsp -->
  <line x1="435" y1="286" x2="435" y2="134" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#v-o)"/>
  <text class="l" x="445" y="220">/joint_states（关节角）</text>

  <!-- rsp → RViz -->
  <line x1="542" y1="95" x2="618" y2="165" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#v-o)"/>
  <text class="l" x="560" y="120">/tf · /tf_static</text>

  <!-- URDF → RViz description 直给 -->
  <path d="M120,240 C120,190 600,190 640,152" fill="none" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#v-p)"/>
  <text class="l" x="380" y="176" fill="var(--purple)">robot_description（模型外观）</text>

  <!-- RViz -->
  <rect x="622" y="156" width="150" height="96" rx="6" fill="#fff"/>
  <rect x="622" y="156" width="150" height="96" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="697" y="186" text-anchor="middle">RViz2</text>
  <text class="s" x="697" y="210" text-anchor="middle">RobotModel 着色</text>
  <text class="s" x="697" y="228" text-anchor="middle">TF Display 画轴</text>
  <text class="s" x="697" y="244" text-anchor="middle">Fixed Frame: chassis</text>

  <!-- 断链风险 -->
  <rect x="30" y="300" width="240" height="90" rx="6" fill="#fff"/>
  <rect x="30" y="300" width="240" height="90" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="150" y="326" text-anchor="middle" fill="var(--red)">断任何一环，车就"散架"</text>
  <text class="s" x="150" y="350" text-anchor="middle">断 /joint_states → No transform</text>
  <text class="s" x="150" y="370" text-anchor="middle">断参数注入 → RViz2 黑屏</text>
  <line x1="272" y1="323" x2="328" y2="323" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#v-r)"/>

  <text class="s" x="400" y="404" text-anchor="middle">模型（URDF）与状态（joint_states）分离——同一份 URDF 可复用于全车队</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：静态模型 × 动态关节角 = 每帧 TF，RViz 只负责按 Fixed Frame 重绘</span>
  <span class="warn">⚠️ 风险：话题断连 → No transform；参数未注入 → 黑屏</span>
  <span class="evid">🔍 验证：04 节 display.launch.py 三节点 + URDF Doctor 症状诊断</span>
</div>
<div class="ft">EXP-20 · URDF 与 Xacro 机器人建模</div>
</body>
</html>
