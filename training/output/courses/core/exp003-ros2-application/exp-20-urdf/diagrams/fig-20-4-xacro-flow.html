<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 20-4 · Xacro 参数化重构</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
html.embedded .hd,html.embedded .dock,html.embedded .ft{display:none}
</style>
<script>if(window.self!==window.top)document.documentElement.className+=' embedded';</script>
</head>
<body>
<div class="hd">
  <h1>图 20-4 · Xacro 参数化重构（复用压缩到 80 行）</h1>
  <p class="q">本图回答的问题：150 行的重复模型，靠哪四步压进 80 行且不丢公式？</p>
</div>
<svg viewBox="0 0 800 330" role="img" aria-label="Xacro 重构流程">
  <defs>
    <marker id="v-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/></marker>
    <marker id="v-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/></marker>
    <marker id="v-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0891b2"/></marker>
    <marker id="v-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e11d48"/></marker>
  </defs>

  <!-- 起点胶囊 -->
  <rect x="24" y="60" width="104" height="44" rx="22" fill="#fff"/>
  <rect x="24" y="60" width="104" height="44" rx="22" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5"/>
  <text class="t" x="76" y="87" text-anchor="middle">手写 150 行</text>
  <line x1="128" y1="82" x2="162" y2="82" stroke="var(--gray)" stroke-width="1.5" marker-end="url(#v-t)"/>

  <!-- step1 property -->
  <rect x="166" y="52" width="150" height="60" rx="6" fill="#fff"/>
  <rect x="166" y="52" width="150" height="60" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="241" y="77" text-anchor="middle">① property 收尺寸</text>
  <text class="s" x="241" y="98" text-anchor="middle">wheel_radius=0.05 …</text>
  <line x1="316" y1="82" x2="350" y2="82" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#v-p)"/>

  <!-- step2 表达式 -->
  <rect x="354" y="52" width="150" height="60" rx="6" fill="#fff"/>
  <rect x="354" y="52" width="150" height="60" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="429" y="77" text-anchor="middle">② ${} 推导联动量</text>
  <text class="s" x="429" y="98" text-anchor="middle">改车宽轮距自动跟</text>
  <line x1="504" y1="82" x2="538" y2="82" stroke="var(--green)" stroke-width="1.5" marker-end="url(#v-g)"/>

  <!-- step3 macro -->
  <rect x="542" y="52" width="150" height="60" rx="6" fill="#fff"/>
  <rect x="542" y="52" width="150" height="60" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="617" y="77" text-anchor="middle">③ macro 公式即代码</text>
  <text class="s" x="617" y="98" text-anchor="middle">惯性宏 + 轮宏 x_reflect</text>

  <!-- step4 展开验证 -->
  <rect x="354" y="170" width="338" height="60" rx="6" fill="#fff"/>
  <rect x="354" y="170" width="338" height="60" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="523" y="195" text-anchor="middle">④ xacro 展开 → check_urdf 复验 → RViz</text>
  <text class="s" x="523" y="216" text-anchor="middle">80 行 .xacro 展开为 150 行 .urdf，结构分毫不差</text>
  <line x1="617" y1="112" x2="560" y2="168" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#v-t)"/>
  <text class="l" x="600" y="146">两行调用镜像左右轮</text>

  <!-- 调用示意 -->
  <rect x="166" y="170" width="150" height="60" rx="6" fill="#fff"/>
  <rect x="166" y="170" width="150" height="60" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="241" y="194" text-anchor="middle">xacro:wheel ×2</text>
  <text class="s" x="241" y="215" text-anchor="middle">x_reflect = ±1</text>
  <line x1="316" y1="200" x2="352" y2="200" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#v-p)"/>
  <line x1="241" y1="112" x2="241" y2="168" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#v-p)"/>

  <!-- 风险 -->
  <rect x="24" y="256" width="752" height="52" rx="6" fill="#fff"/>
  <rect x="24" y="256" width="752" height="52" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="400" y="278" text-anchor="middle" fill="var(--red)">① 根标签漏 xmlns:xacro → 所有宏标签失效　② 宏调用 name 撞车 → 重复 link，解析失败</text>
  <text class="s" x="400" y="298" text-anchor="middle">宏定义必须先于调用、且同在一个 &lt;robot&gt; 标签内</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：改一处尺寸，全模联动——80 行管住 150 行</span>
  <span class="warn">⚠️ 风险：xmlns 未声明宏全失效；name 撞车解析失败</span>
  <span class="evid">🔍 验证：04 节 head -80 展开对比 + check_urdf 复验通过</span>
</div>
<div class="ft">EXP-20 · URDF 与 Xacro 机器人建模</div>
</body>
</html>
