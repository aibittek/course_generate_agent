<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 16-4 · 离线联调数据流</title>
<style>
:root{--bg-page:#ffffff;--bg-card:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;
  --border:#e2e8f0;--teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd{margin-bottom:6px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 16-4 · 离线联调数据流：带钟回放的四小步</h1>
  <p class="q">本图回答的问题：要让 rviz2 看着"历史三维场景"，play、/clock、rviz、Time 面板怎么串起来？</p>
</div>
<svg viewBox="0 0 760 440" role="img" aria-label="离线联调数据流图">
  <!-- step1 -->
  <rect x="30" y="40" width="168" height="64" rx="8" fill="#fff" stroke="var(--green)" stroke-width="1.8"/>
  <rect x="30" y="40" width="30" height="24" rx="6" fill="var(--green)"/>
  <text x="45" y="57" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1</text>
  <text class="t" x="118" y="64" text-anchor="middle">带钟回放</text>
  <text class="s" x="118" y="86" text-anchor="middle">play --clock --loop</text>

  <line x1="198" y1="72" x2="252" y2="72" stroke="var(--orange)" stroke-width="1.8" marker-end="url(#ao)"/>
  <text class="l" x="204" y="62" fill="var(--orange)">~40Hz /clock</text>

  <!-- step2 -->
  <rect x="256" y="40" width="168" height="64" rx="8" fill="#fff" stroke="var(--teal)" stroke-width="1.8"/>
  <rect x="256" y="40" width="30" height="24" rx="6" fill="var(--teal)"/>
  <text x="271" y="57" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">2</text>
  <text class="t" x="344" y="64" text-anchor="middle">视图认钟</text>
  <text class="s" x="344" y="86" text-anchor="middle">rviz2 -p use_sim_time:=true</text>

  <line x1="424" y1="72" x2="478" y2="72" stroke="var(--teal)" stroke-width="1.8" marker-end="url(#at)"/>

  <!-- step3 -->
  <rect x="482" y="40" width="120" height="64" rx="8" fill="#fff" stroke="var(--teal)" stroke-width="1.8"/>
  <rect x="482" y="40" width="30" height="24" rx="6" fill="var(--teal)"/>
  <text x="497" y="57" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">3</text>
  <text class="t" x="546" y="64" text-anchor="middle">Time 面板</text>
  <text class="s" x="546" y="86" text-anchor="middle">Panels→Add→Time</text>

  <line x1="602" y1="72" x2="652" y2="72" stroke="var(--teal)" stroke-width="1.8" marker-end="url(#at)"/>

  <!-- step4 -->
  <rect x="656" y="40" width="86" height="64" rx="8" fill="#fff" stroke="var(--teal)" stroke-width="1.8"/>
  <rect x="656" y="40" width="30" height="24" rx="6" fill="var(--teal)"/>
  <text x="671" y="57" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">4</text>
  <text class="t" x="704" y="64" text-anchor="middle" font-size="11.5">加图层</text>
  <text class="s" x="699" y="86" text-anchor="middle">LaserScan·TF·Image</text>

  <!-- 数据回流 -->
  <text class="l" x="30" y="150" fill="var(--purple)">rviz2 订阅的历史话题（与 /clock 同处回放时间轴）</text>
  <rect x="30" y="162" width="712" height="74" rx="9" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <g class="s" font-weight="600">
    <text x="52" y="192">/scan · LaserScan 面板</text>
    <text x="252" y="192">/tf · 变换树面板</text>
    <text x="432" y="192">/path · 轨迹面板</text>
    <text x="610" y="192">图像话题 · Image</text>
  </g>
  <g class="s">
    <text x="52" y="216" fill="var(--gray)">rviz 按 Display 绘制</text>
    <text x="252" y="216" fill="var(--gray)">stamp 走 /clock</text>
    <text x="432" y="216" fill="var(--gray)">原时序重建</text>
    <text x="610" y="216" fill="var(--gray)">Topic 按包内容选</text>
  </g>

  <!-- play → 数据回流 -->
  <line x1="340" y1="104" x2="340" y2="162" stroke="var(--green)" stroke-width="1.8" marker-end="url(#ag2)"/>
  <text class="l" x="350" y="138" fill="var(--green)">再生发布</text>

  <!-- 判断：对时验证 -->
  <polygon points="380,282 520,316 380,350 240,316" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="380" y="310" text-anchor="middle">ros2 topic delay /scan</text>
  <text class="s" x="380" y="330" text-anchor="middle">必须是带 header 的话题</text>

  <line x1="340" y1="236" x2="340" y2="288" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ag)"/>
  <text class="l" x="130" y="268" fill="var(--gray)">抽样回放流验证</text>

  <text class="l" x="170" y="308" fill="var(--green)">正值且很小</text>
  <line x1="240" y1="316" x2="165" y2="360" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag2)"/>
  <rect x="46" y="362" width="200" height="52" rx="8" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="146" y="386" text-anchor="middle">✅ 时钟对齐</text>
  <text class="s" x="146" y="404" text-anchor="middle">Time 面板随回放增长</text>

  <text class="l" x="540" y="308" fill="var(--red)">负值 / 无 header</text>
  <line x1="520" y1="316" x2="600" y2="360" stroke="var(--red)" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="514" y="362" width="230" height="52" rx="8" fill="var(--red)" fill-opacity=".07" stroke="var(--red)" stroke-width="1.5"/>
  <text class="t" x="629" y="386" text-anchor="middle" fill="var(--red)">❌ 时间错位</text>
  <text class="s" x="629" y="404" text-anchor="middle" fill="var(--red)">/chatter 报 no header · 换 /scan /odom</text>

  <text class="s" x="380" y="432" text-anchor="middle" fill="var(--gray)">漏开关的另一症状：TF LookupException 满屏（now=今天 · stamp=昨天）</text>

  <defs>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--orange)"/></marker>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--teal)"/></marker>
    <marker id="ag2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--green)"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--gray)"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--red)"/></marker>
  </defs>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：play --clock ＋ use_sim_time 两开关都开，rviz 才进入"历史时空"</span>
  <span class="warn">⚠️ 风险：漏开关 TF LookupException · delay 别用无 header 的 /chatter</span>
  <span class="evid">🔍 验证：04 节 4 双开关 + Time 面板 + topic delay /scan</span>
</div>
<div class="ft">EXP-16 · rosbag2 数据录制与回放</div>
</body>
</html>
