<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 12-2 · 两阶段发现</title>
<style>
:root{--bg-page:#ffffff;--bg-card:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;
  --border:#e2e8f0;--teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd{margin-bottom:6px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 12-2 · 两阶段发现：先 SPDP 找人，再 SEDP 找端点</h1>
  <p class="q">本图回答的问题：没写连接代码，两个节点后台分几步完成匹配？</p>
</div>
<svg viewBox="0 0 760 520" role="img" aria-label="SPDP 与 SEDP 两阶段发现流程">
  <defs>
    <marker id="ap12" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--orange)"/></marker>
    <marker id="ag12" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--green)"/></marker>
    <marker id="ar12" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--red)"/></marker>
    <marker id="apu12" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--purple)"/></marker>
  </defs>

  <!-- 参与者 -->
  <rect x="46" y="18" width="190" height="56" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="141" y="42" text-anchor="middle">节点 A · Participant</text>
  <text class="s" x="141" y="61" text-anchor="middle">GUID 0x1a… · 域 0</text>
  <rect x="524" y="18" width="190" height="56" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="619" y="42" text-anchor="middle">节点 B · Participant</text>
  <text class="s" x="619" y="61" text-anchor="middle">GUID 0x2b… · 域 0</text>

  <!-- 阶段一 SPDP：组播 -->
  <text class="l" x="380" y="98" text-anchor="middle">① SPDP · 每周期向组播喊"我来了"</text>
  <line x1="236" y1="74" x2="300" y2="120" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#ap12)"/>
  <line x1="524" y1="74" x2="460" y2="120" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#ap12)"/>
  <rect x="256" y="122" width="248" height="46" rx="6" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1.5"/>
  <text class="t" x="380" y="142" text-anchor="middle">组播 239.255.0.1 · 7400</text>
  <text class="s" x="380" y="160" text-anchor="middle">BestEffort · 丢一两条下周期再喊</text>

  <!-- 花名册 -->
  <line x1="380" y1="168" x2="380" y2="196" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#apu12)"/>
  <text class="l" x="392" y="188">记进花名册</text>
  <rect x="246" y="198" width="268" height="46" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="380" y="218" text-anchor="middle">花名册：互记 GUID + 楼号</text>
  <text class="s" x="380" y="236" text-anchor="middle">只是"知道有谁"，无数据流动</text>

  <!-- 阶段二 SEDP -->
  <line x1="380" y1="244" x2="380" y2="272" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#ap12)"/>
  <text class="l" x="392" y="264">② SEDP · 交换端点</text>
  <rect x="236" y="274" width="288" height="56" rx="6" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1.5"/>
  <text class="t" x="380" y="296" text-anchor="middle">端点清单 + QoS 互相交换</text>
  <text class="s" x="380" y="316" text-anchor="middle">话题名 · 类型 · QoS 合同</text>

  <!-- 判断门 -->
  <line x1="380" y1="330" x2="380" y2="360" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag12)"/>
  <text class="l" x="392" y="350">③ 三门判定</text>
  <polygon points="380,362 512,400 380,438 248,400" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="380" y="394" text-anchor="middle">同域 + 同话题类型</text>
  <text class="s" x="380" y="414" text-anchor="middle">且 QoS 请求 ≤ 提供 ?</text>

  <!-- 结果 -->
  <text class="l" x="418" y="466">是</text>
  <line x1="380" y1="438" x2="380" y2="474" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag12)"/>
  <rect x="246" y="476" width="268" height="46" rx="6" fill="var(--green)" fill-opacity="0.12" stroke="var(--green)" stroke-width="2"/>
  <text class="t" x="380" y="496" text-anchor="middle">撮合成功 · 数据链路建立</text>
  <text class="s" x="380" y="514" text-anchor="middle">publish → subscribe 送达</text>

  <!-- 否分支 -->
  <text class="l" x="536" y="404">否</text>
  <line x1="512" y1="400" x2="606" y2="400" stroke="var(--red)" stroke-width="1.5" marker-end="url(#ar12)"/>
  <rect x="608" y="374" width="126" height="52" rx="6" fill="#fff" stroke="var(--red)" stroke-width="1.5"/>
  <text class="t" x="671" y="396" text-anchor="middle">拒绝撮合</text>
  <text class="s" x="671" y="414" text-anchor="middle">count: 0 · 无报错</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：SPDP 找人 → SEDP 找端点，零配置完成建链</span>
  <span class="warn">⚠️ 风险：任一门不过即无声失败，无任何报错提示</span>
  <span class="evid">🔍 验证：互动 12-1 四步 + 04 节 B-2（count: 0）</span>
</div>
<div class="ft">EXP-12 · DDS 通信中间件剖析</div>
</body>
</html>
