<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 12-4 · QoS 实验：三门撮合判定</title>
<style>
:root{--bg-page:#ffffff;--bg-card:#fff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;
  --border:#e2e8f0;--teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd{margin-bottom:6px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 12-4 · QoS 实验：三门撮合判定流程</h1>
  <p class="q">本图回答的问题：改了哪个 QoS 参数会导致"连不上"，报错为什么看不见？</p>
</div>
<svg viewBox="0 0 760 540" role="img" aria-label="QoS 三门撮合判定流程">
  <defs>
    <marker id="a4g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--green)"/></marker>
    <marker id="a4r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--red)"/></marker>
    <marker id="a4t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--teal)"/></marker>
  </defs>

  <!-- 起点 -->
  <rect x="270" y="16" width="220" height="42" rx="21" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="380" y="42" text-anchor="middle">发现对端 Publisher / Subscriber</text>

  <!-- 门1 -->
  <line x1="380" y1="58" x2="380" y2="86" stroke="var(--green)" stroke-width="1.5" marker-end="url(#a4g)"/>
  <text class="l" x="392" y="76">门①</text>
  <polygon points="380,88 546,130 380,172 214,130" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="380" y="124" text-anchor="middle">同一 ROS_DOMAIN_ID ?</text>
  <text class="s" x="380" y="146" text-anchor="middle">同楼才可能对话</text>
  <text class="l" x="566" y="134">否</text>
  <line x1="546" y1="130" x2="636" y2="130" stroke="var(--red)" stroke-width="1.5" marker-end="url(#a4r)"/>
  <rect x="638" y="106" width="104" height="48" rx="6" fill="#fff" stroke="var(--red)" stroke-width="1.5"/>
  <text class="t" x="690" y="127" text-anchor="middle">互不可见</text>
  <text class="s" x="690" y="145" text-anchor="middle">话题列表无对端</text>

  <!-- 门2 -->
  <line x1="380" y1="172" x2="380" y2="204" stroke="var(--green)" stroke-width="1.5" marker-end="url(#a4g)"/>
  <text class="l" x="392" y="194">是</text>
  <polygon points="380,206 566,248 380,290 194,248" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="380" y="242" text-anchor="middle">话题名 + 类型都相同 ?</text>
  <text class="s" x="380" y="264" text-anchor="middle">Type: std_msgs/msg/String</text>
  <text class="l" x="586" y="252">否</text>
  <line x1="566" y1="248" x2="636" y2="248" stroke="var(--red)" stroke-width="1.5" marker-end="url(#a4r)"/>
  <rect x="638" y="224" width="104" height="48" rx="6" fill="#fff" stroke="var(--red)" stroke-width="1.5"/>
  <text class="t" x="690" y="245" text-anchor="middle">不撮合</text>
  <text class="s" x="690" y="263" text-anchor="middle">各发各的</text>

  <!-- 门3 -->
  <line x1="380" y1="290" x2="380" y2="322" stroke="var(--green)" stroke-width="1.5" marker-end="url(#a4g)"/>
  <text class="l" x="392" y="312">是</text>
  <polygon points="380,324 586,368 380,412 174,368" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="380" y="362" text-anchor="middle">QoS 请求 ≤ 提供 ?</text>
  <text class="s" x="380" y="384" text-anchor="middle">reliability · durability · history</text>
  <text class="l" x="606" y="372">否 · 例：订 RELIABLE / 发 BEST_EFFORT</text>
  <line x1="586" y1="368" x2="636" y2="368" stroke="var(--red)" stroke-width="1.5" marker-end="url(#a4r)"/>
  <rect x="638" y="344" width="104" height="48" rx="6" fill="#fff" stroke="var(--red)" stroke-width="1.5"/>
  <text class="t" x="690" y="365" text-anchor="middle">count: 0</text>
  <text class="s" x="690" y="383" text-anchor="middle">仅 WARN 提示</text>

  <!-- 结果 -->
  <line x1="380" y1="412" x2="380" y2="444" stroke="var(--green)" stroke-width="1.5" marker-end="url(#a4g)"/>
  <text class="l" x="392" y="434">是</text>
  <rect x="240" y="446" width="280" height="46" rx="6" fill="var(--green)" fill-opacity="0.12" stroke="var(--green)" stroke-width="2"/>
  <text class="t" x="380" y="466" text-anchor="middle">撮合成功 · 数据送达</text>
  <text class="s" x="380" y="484" text-anchor="middle">B-1 积压 5 条 = TRANSIENT_LOCAL 命中</text>

  <text class="l" x="380" y="522" text-anchor="middle" fill="#94a3b8">三门是依次短路的：任何一门不过，后面根本不判 —— 所以"连不上"往往一声不吭</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：同域 → 同话题类型 → QoS 兼容，三门全过才建链</span>
  <span class="warn">⚠️ 风险：门③失败无报错，只有 topic info -v 的 count: 0</span>
  <span class="evid">🔍 验证：04 节 B-1（收历史）与 B-2（WARN + count: 0）</span>
</div>
<div class="ft">EXP-12 · DDS 通信中间件剖析</div>
</body>
</html>
