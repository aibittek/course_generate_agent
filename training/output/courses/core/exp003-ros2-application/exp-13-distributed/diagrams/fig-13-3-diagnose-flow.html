<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 13-3 · 组网诊断台：四步判定</title>
<style>
:root{--bg-page:#ffffff;--bg-card:#fff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;
  --border:#e2e8f0;--teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd{margin-bottom:6px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 13-3 · 组网诊断台：两台设备看不见时的四步判定</h1>
  <p class="q">本图回答的问题：按什么顺序排查"节点互相看不见"，每步用哪条命令？</p>
</div>
<svg viewBox="0 0 760 540" role="img" aria-label="组网诊断四步判定流程">
  <defs>
    <marker id="a3g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--green)"/></marker>
    <marker id="a3r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--red)"/></marker>
    <marker id="a3t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--teal)"/></marker>
  </defs>

  <!-- 起点 -->
  <rect x="252" y="14" width="256" height="42" rx="21" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="380" y="40" text-anchor="middle">现象：两台设备节点互相看不见</text>

  <!-- 判1 域号 -->
  <line x1="380" y1="56" x2="380" y2="82" stroke="var(--green)" stroke-width="1.5" marker-end="url(#a3g)"/>
  <text class="l" x="392" y="74">步①</text>
  <polygon points="380,84 546,126 380,168 214,126" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="380" y="120" text-anchor="middle">两端 ROS_DOMAIN_ID 一致?</text>
  <text class="s" x="380" y="142" text-anchor="middle">echo $ROS_DOMAIN_ID</text>
  <text class="l" x="566" y="130">否</text>
  <line x1="546" y1="126" x2="606" y2="126" stroke="var(--red)" stroke-width="1.5" marker-end="url(#a3r)"/>
  <rect x="608" y="100" width="138" height="52" rx="6" fill="#fff" stroke="var(--red)" stroke-width="1.5"/>
  <text class="t" x="677" y="121" text-anchor="middle">修：改回同域</text>
  <text class="s" x="677" y="141" text-anchor="middle">export / 前缀 / bashrc</text>

  <!-- 判2 ping -->
  <line x1="380" y1="168" x2="380" y2="200" stroke="var(--green)" stroke-width="1.5" marker-end="url(#a3g)"/>
  <text class="l" x="392" y="190">是</text>
  <polygon points="380,202 546,244 380,286 214,244" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="380" y="238" text-anchor="middle">同网段 · ping 通 ?</text>
  <text class="s" x="380" y="260" text-anchor="middle">前提① · IP 可达</text>
  <text class="l" x="566" y="248">否</text>
  <line x1="546" y1="244" x2="606" y2="244" stroke="var(--red)" stroke-width="1.5" marker-end="url(#a3r)"/>
  <rect x="608" y="218" width="138" height="52" rx="6" fill="#fff" stroke="var(--red)" stroke-width="1.5"/>
  <text class="t" x="677" y="239" text-anchor="middle">修：查网段/NAT</text>
  <text class="s" x="677" y="259" text-anchor="middle">虚拟机改桥接模式</text>

  <!-- 判3 组播 -->
  <line x1="380" y1="286" x2="380" y2="318" stroke="var(--green)" stroke-width="1.5" marker-end="url(#a3g)"/>
  <text class="l" x="392" y="308">通</text>
  <polygon points="380,320 556,364 380,408 204,364" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="380" y="357" text-anchor="middle">组播通? send / receive</text>
  <text class="s" x="380" y="380" text-anchor="middle">前提③ · ros2 multicast</text>
  <text class="l" x="576" y="368">否 · 防火墙/IGMP 拦</text>
  <line x1="556" y1="364" x2="606" y2="364" stroke="var(--red)" stroke-width="1.5" marker-end="url(#a3r)"/>
  <rect x="608" y="338" width="138" height="52" rx="6" fill="#fff" stroke="var(--red)" stroke-width="1.5"/>
  <text class="t" x="677" y="359" text-anchor="middle">修：放行组播</text>
  <text class="s" x="677" y="379" text-anchor="middle">ufw allow 7400:8399</text>

  <!-- 判4 QoS -->
  <line x1="380" y1="408" x2="380" y2="440" stroke="var(--green)" stroke-width="1.5" marker-end="url(#a3g)"/>
  <text class="l" x="392" y="430">通</text>
  <rect x="214" y="442" width="230" height="52" rx="6" fill="var(--green)" fill-opacity="0.12" stroke="var(--green)" stroke-width="2"/>
  <text class="t" x="329" y="463" text-anchor="middle">查 QoS · 组播仍禁用换服务</text>
  <text class="s" x="329" y="483" text-anchor="middle">请求 ≤ 提供 · DISCOVERY_SERVER</text>

  <rect x="474" y="442" width="242" height="52" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="595" y="463" text-anchor="middle">组播被禁的兜底方案</text>
  <text class="s" x="595" y="483" text-anchor="middle">fastdds discovery + export 服务器</text>
  <line x1="444" y1="468" x2="474" y2="468" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="l" x="380" y="524" text-anchor="middle" fill="#94a3b8">顺序不能倒着来：先 ID，再 ping，后组播——否则会把配置问题当网络问题查</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：ID → ping → 组播 → QoS，四步按序排查</span>
  <span class="warn">⚠️ 风险：组播通仍可被禁组播网阻断 → 换 DISCOVERY_SERVER</span>
  <span class="evid">🔍 验证：诊断台六场景（fw / vm / server）逐一复现</span>
</div>
<div class="ft">EXP-13 · ROS2 分布式通讯</div>
</body>
</html>
