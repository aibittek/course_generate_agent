<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 13-1 · 域隔离物理过程</title>
<style>
:root{--bg-page:#ffffff;--bg-card:#fff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;
  --border:#e2e8f0;--teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd{margin-bottom:6px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 13-1 · 域隔离物理过程：一个数字换一套地址端口</h1>
  <p class="q">本图回答的问题：改一个 ROS_DOMAIN_ID，为什么两台机器就"互相看不见"了？</p>
</div>
<svg viewBox="0 0 760 540" role="img" aria-label="同域互通与异域隔离的组播地址端口对比">
  <defs>
    <marker id="a13g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--green)"/></marker>
    <marker id="a13o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--orange)"/></marker>
    <marker id="a13gr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--gray)"/></marker>
  </defs>

  <!-- 上半：同域 -->
  <rect x="12" y="14" width="736" height="238" rx="10" fill="none" stroke="#a7f3d0" stroke-width="1.5"/>
  <text class="l" x="24" y="36" fill="#059669">同域（ID=0）→ 互通</text>

  <rect x="36" y="56" width="200" height="66" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="136" y="80" text-anchor="middle">设备 A · 笔记本</text>
  <text class="s" x="136" y="100" text-anchor="middle">域 0 · 239.255.0.1:7400</text>

  <rect x="524" y="56" width="200" height="66" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="624" y="80" text-anchor="middle">设备 B · 机器人</text>
  <text class="s" x="624" y="100" text-anchor="middle">域 0 · 239.255.0.1:7400</text>

  <!-- 同域组播总线 -->
  <line x1="236" y1="89" x2="524" y2="89" stroke="var(--orange)" stroke-width="2.5"/>
  <text class="l" x="380" y="80" text-anchor="middle" fill="#ea580c">SPDP 组播宣告 · 同地址同端口</text>

  <polygon points="380,122 560,168 380,214 200,168" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1.5"/>
  <text class="t" x="380" y="162" text-anchor="middle">SEDP 交换端点 + QoS</text>
  <text class="s" x="380" y="184" text-anchor="middle">话题同名 + 类型同 + QoS 兼容</text>
  <line x1="136" y1="122" x2="256" y2="160" stroke="var(--green)" stroke-width="1.5" marker-end="url(#a13g)"/>
  <line x1="624" y1="122" x2="504" y2="160" stroke="var(--green)" stroke-width="1.5" marker-end="url(#a13g)"/>

  <rect x="256" y="226" width="248" height="42" rx="6" fill="var(--green)" fill-opacity="0.12" stroke="var(--green)" stroke-width="2"/>
  <text class="t" x="380" y="252" text-anchor="middle">数据链路建立 ✓</text>

  <!-- 下半：异域 -->
  <rect x="12" y="288" width="736" height="234" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="l" x="24" y="310" fill="#64748b">异域（0 / 5）→ 物理分流，互不可见</text>

  <rect x="36" y="332" width="200" height="66" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="136" y="356" text-anchor="middle">设备 A</text>
  <text class="s" x="136" y="376" text-anchor="middle">域 0 · 239.255.0.1:7400</text>

  <rect x="524" y="332" width="200" height="66" rx="6" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5"/>
  <text class="t" x="624" y="356" text-anchor="middle">设备 C</text>
  <text class="s" x="624" y="376" text-anchor="middle">域 5 · 239.255.0.6:7650</text>

  <!-- 两条互不相交的通道 -->
  <line x1="236" y1="365" x2="470" y2="365" stroke="var(--orange)" stroke-width="2" stroke-dasharray="7,5"/>
  <text class="l" x="353" y="356" text-anchor="middle" fill="#ea580c">通道①：239.255.0.1:7400</text>
  <line x1="290" y1="414" x2="524" y2="414" stroke="var(--orange)" stroke-width="2" stroke-dasharray="7,5"/>
  <text class="l" x="407" y="405" text-anchor="middle" fill="#ea580c">通道②：239.255.0.6:7650</text>

  <rect x="236" y="440" width="290" height="42" rx="6" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="381" y="458" text-anchor="middle">网卡分流：地址端口不同即丢弃</text>
  <text class="s" x="381" y="476" text-anchor="middle">isolation · 报文根本到不了对方栈</text>
  <line x1="353" y1="398" x2="353" y2="440" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a13gr)"/>
  <line x1="407" y1="414" x2="407" y2="440" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a13gr)"/>

  <text class="l" x="380" y="510" text-anchor="middle" fill="#94a3b8">端口 = 7400 + 250×域号 · 地址末位 = 域号 + 1</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：域号→地址端口是物理映射，隔离发生在网卡分流层</span>
  <span class="warn">⚠️ 风险：全域默认 0 就是串台；组播被拦则同域也不可见</span>
  <span class="evid">🔍 验证：EXP-12 A-1 实测 7400/9150 + 本课三终端实操</span>
</div>
<div class="ft">EXP-13 · ROS2 分布式通讯</div>
</body>
</html>
