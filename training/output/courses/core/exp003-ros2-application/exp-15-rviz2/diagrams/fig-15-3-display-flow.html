<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 15-3 · display.launch.py 节点数据流</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 15-3 · display.launch.py 节点数据流：滑块 → 画面</h1>
  <p class="q">本图回答的问题：拖一下关节滑块，到模型动起来中间经过哪几步？断在中间会怎样？</p>
</div>
<svg viewBox="0 0 760 470" role="img" aria-label="display.launch 节点数据流">
  <defs>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--orange)"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--green)"/></marker>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--teal)"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" x1="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--red)"/></marker>
    <marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--red)"/></marker>
  </defs>

  <!-- 起点 -->
  <rect x="270" y="18" width="220" height="42" rx="21" fill="#fff"/>
  <rect x="270" y="18" width="220" height="42" rx="21" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="380" y="44" text-anchor="middle">拖动关节滑块</text>
  <line x1="380" y1="60" x2="380" y2="96" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#at)"/>
  <text class="l" x="390" y="82">产生关节角</text>

  <!-- jsp -->
  <rect x="255" y="100" width="250" height="60" rx="6" fill="#fff"/>
  <rect x="255" y="100" width="250" height="60" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="380" y="126" text-anchor="middle">joint_state_publisher_gui</text>
  <text class="s" x="380" y="146" text-anchor="middle">把滑块值发成关节状态</text>
  <line x1="380" y1="160" x2="380" y2="196" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#ao)"/>
  <text class="l" x="390" y="182">/joint_states</text>

  <!-- rsp -->
  <rect x="255" y="200" width="250" height="76" rx="6" fill="#fff"/>
  <rect x="255" y="200" width="250" height="76" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="380" y="226" text-anchor="middle">robot_state_publisher</text>
  <text class="s" x="380" y="246" text-anchor="middle">关节角 + URDF → 各 link 变换</text>
  <text class="s" x="380" y="264" text-anchor="middle">（固定偏移进 /tf_static 只发一次）</text>
  <line x1="380" y1="276" x2="380" y2="312" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#ao)"/>
  <text class="l" x="390" y="298">/tf（动态）</text>

  <!-- rviz2 -->
  <rect x="255" y="316" width="250" height="64" rx="6" fill="#fff"/>
  <rect x="255" y="316" width="250" height="64" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="380" y="342" text-anchor="middle">rviz2 · TF/RobotModel 图层</text>
  <text class="s" x="380" y="362" text-anchor="middle">拿最新 TF 重画部件与坐标轴</text>
  <line x1="380" y1="380" x2="380" y2="410" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#at)"/>

  <rect x="270" y="412" width="220" height="40" rx="20" fill="#fff"/>
  <rect x="270" y="412" width="220" height="40" rx="20" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="380" y="437" text-anchor="middle">部件在画面里实时转动</text>

  <!-- 风险：中间断链 -->
  <rect x="30" y="210" width="180" height="66" rx="6" fill="#fff"/>
  <rect x="30" y="210" width="180" height="66" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.5"/>
  <text class="t" x="120" y="234" text-anchor="middle">rsp 没起来（风险）</text>
  <text class="s" x="120" y="254" text-anchor="middle">/tf 不存在 → 黄字</text>
  <text class="s" x="120" y="270" text-anchor="middle">滑块动而模型不动</text>
  <line x1="210" y1="243" x2="251" y2="243" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#aR)"/>

  <!-- 边：话题停更 -->
  <rect x="550" y="210" width="180" height="66" rx="6" fill="#fff"/>
  <rect x="550" y="210" width="180" height="66" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.5"/>
  <text class="t" x="640" y="234" text-anchor="middle">/joint_states 停更（风险）</text>
  <text class="s" x="640" y="254" text-anchor="middle">gui 关掉 → 模型冻结</text>
  <text class="s" x="640" y="270" text-anchor="middle">冻结在最后姿态</text>
  <line x1="505" y1="228" x2="547" y2="240" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#aR)"/>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：滑块 → /joint_states → rsp 算变换 → /tf → rviz2 重绘，逐环相扣</span>
  <span class="warn">⚠️ 风险：中间任一环缺失，现象都是"滑块动、模型不动"</span>
  <span class="evid">🔍 验证：04 节第 7 步拖滑块 + 第 6 步 tf2_echo 实测 0.029m 偏移</span>
</div>
<div class="ft">EXP-15 · rviz2 三维可视化</div>
</body>
</html>
