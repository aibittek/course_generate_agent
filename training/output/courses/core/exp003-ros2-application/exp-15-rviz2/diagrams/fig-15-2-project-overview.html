<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 15-2 · 工程全景</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.bnd{font:700 11px system-ui,sans-serif}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 15-2 · 工程全景：源文件、三节点、话题与画面</h1>
  <p class="q">本图回答的问题：一条 launch 命令背后，哪些文件和节点在动，数据从哪流到画面？</p>
</div>
<svg viewBox="0 0 780 400" role="img" aria-label="display.launch 工程全景框架图">
  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--purple)"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--green)"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--orange)"/></marker>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--teal)"/></marker>
  </defs>

  <!-- 层1 源文件 -->
  <rect x="30" y="24" width="720" height="100" rx="12" fill="none" stroke="var(--purple)" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text class="bnd" x="44" y="44" fill="var(--purple)">源文件 · car1_description 包</text>
  <rect x="50" y="54" width="180" height="56" rx="6" fill="#fff"/>
  <rect x="50" y="54" width="180" height="56" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="140" y="78" text-anchor="middle">car1 URDF 模型</text>
  <text class="s" x="140" y="98" text-anchor="middle">xacro 描述 · link/joint 树</text>

  <rect x="295" y="54" width="190" height="56" rx="6" fill="#fff"/>
  <rect x="295" y="54" width="190" height="56" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="390" y="78" text-anchor="middle">display.launch.py</text>
  <text class="s" x="390" y="98" text-anchor="middle">启动剧本 · 三个 Node Action</text>

  <rect x="520" y="54" width="210" height="56" rx="6" fill="#fff"/>
  <rect x="520" y="54" width="210" height="56" rx="6" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.5"/>
  <text class="t" x="625" y="78" text-anchor="middle">car1.rviz 配置</text>
  <text class="s" x="625" y="98" text-anchor="middle">Fixed Frame=base_footprint</text>

  <!-- 层2 节点 -->
  <rect x="30" y="148" width="720" height="116" rx="12" fill="none" stroke="var(--green)" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text class="bnd" x="44" y="168" fill="var(--green)">节点 · ros2 launch 一次拉起</text>

  <rect x="50" y="184" width="200" height="64" rx="6" fill="#fff"/>
  <rect x="50" y="184" width="200" height="64" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="150" y="210" text-anchor="middle">robot_state_publisher</text>
  <text class="s" x="150" y="230" text-anchor="middle">读 URDF 算 link 变换</text>

  <rect x="290" y="184" width="200" height="64" rx="6" fill="#fff"/>
  <rect x="290" y="184" width="200" height="64" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="390" y="210" text-anchor="middle">joint_state_publisher_gui</text>
  <text class="s" x="390" y="230" text-anchor="middle">滑块喂关节角</text>

  <rect x="530" y="184" width="200" height="64" rx="6" fill="#fff"/>
  <rect x="530" y="184" width="200" height="64" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="630" y="210" text-anchor="middle">rviz2（消费者）</text>
  <text class="s" x="630" y="230" text-anchor="middle">-d 加载 car1.rviz</text>

  <!-- 层1 → 层2 -->
  <line x1="140" y1="110" x2="148" y2="182" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#ap)"/>
  <text class="l" x="156" y="150">加载模型</text>
  <line x1="330" y1="110" x2="205" y2="182" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#ap)"/>
  <text class="l" x="252" y="140" text-anchor="middle">拉起</text>
  <line x1="390" y1="110" x2="390" y2="182" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#ap)"/>
  <text class="l" x="398" y="150">拉起</text>
  <line x1="452" y1="110" x2="600" y2="182" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#ap)"/>
  <text class="l" x="540" y="146">拉起 -d</text>
  <line x1="625" y1="110" x2="632" y2="182" stroke="var(--purple)" stroke-width="1.5" marker-end="url(#ap)"/>
  <text class="l" x="642" y="150">按配置</text>

  <!-- 节点间数据 -->
  <line x1="288" y1="216" x2="252" y2="216" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#ao)"/>
  <text class="l" x="270" y="206" text-anchor="middle">/joint_states</text>

  <!-- 层3 话题与画面 -->
  <rect x="30" y="288" width="720" height="96" rx="12" fill="none" stroke="var(--orange)" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text class="bnd" x="44" y="308" fill="var(--orange)">话题与画面</text>

  <rect x="170" y="322" width="300" height="50" rx="6" fill="#fff"/>
  <rect x="170" y="322" width="300" height="50" rx="6" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1.5"/>
  <text class="t" x="320" y="344" text-anchor="middle">/tf · /tf_static · /robot_description</text>
  <text class="s" x="320" y="362" text-anchor="middle">坐标变换与模型描述（话题）</text>

  <rect x="530" y="322" width="200" height="50" rx="6" fill="#fff"/>
  <rect x="530" y="322" width="200" height="50" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="630" y="344" text-anchor="middle">三维视口画面</text>
  <text class="s" x="630" y="362" text-anchor="middle">Grid · RobotModel · TF</text>

  <line x1="160" y1="248" x2="330" y2="320" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#ao)"/>
  <text class="l" x="214" y="292">发布</text>
  <line x1="474" y1="340" x2="612" y2="254" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#ao)"/>
  <text class="l" x="556" y="300">订阅·变换</text>
  <line x1="630" y1="248" x2="630" y2="320" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#at)"/>
  <text class="l" x="640" y="288">按 Display 绘制</text>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：launch 一次拉起生产者（jsp+rsp）与消费者（rviz2），数据经话题汇入画面</span>
  <span class="warn">⚠️ 风险：只开 rviz2 = 只有消费者，/tf 与话题根本不存在</span>
  <span class="evid">🔍 验证：04 节第 3/6/8 步 node list、topic list、tf2_echo 实测</span>
</div>
<div class="ft">EXP-15 · rviz2 三维可视化</div>
</body>
</html>
