<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 15-1 · 消息渲染管线</title>
<style>
:root{--bg-page:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
  --teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--red-bg:rgba(225,29,72,.08);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 15-1 · 消息渲染管线：frame_id → TF 链 → Fixed Frame → 绘制</h1>
  <p class="q">本图回答的问题：一条 /scan 消息是怎么变成屏幕上的一批点的？</p>
</div>
<svg viewBox="0 0 760 380" role="img" aria-label="rviz2 消息渲染管线框架图">
  <defs>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--orange)"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--green)"/></marker>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--teal)"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--red)"/></marker>
  </defs>

  <!-- ① 数据源 -->
  <rect x="30" y="60" width="165" height="66" rx="6" fill="#fff"/>
  <rect x="30" y="60" width="165" height="66" rx="6" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1.5"/>
  <text class="t" x="112" y="86" text-anchor="middle">/scan 激光消息</text>
  <text class="s" x="112" y="106" text-anchor="middle">header.frame_id = laser</text>

  <!-- ② TF 链（处理） -->
  <line x1="197" y1="93" x2="252" y2="93" stroke="var(--orange)" stroke-width="1.5" marker-end="url(#ao)"/>
  <text class="l" x="224" y="82" text-anchor="middle">订阅</text>
  <rect x="256" y="48" width="230" height="90" rx="6" fill="#fff"/>
  <rect x="256" y="48" width="230" height="90" rx="6" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
  <text class="t" x="371" y="72" text-anchor="middle">TF2 变换链 · 逐级查找</text>
  <g>
    <rect x="274" y="88" width="56" height="28" rx="6" fill="#fff" stroke="var(--purple)" stroke-width="1.2"/>
    <text class="s" x="302" y="106" text-anchor="middle">laser</text>
    <rect x="336" y="88" width="56" height="28" rx="6" fill="#fff" stroke="var(--purple)" stroke-width="1.2"/>
    <text class="s" x="364" y="106" text-anchor="middle">base_link</text>
    <rect x="398" y="88" width="70" height="28" rx="6" fill="#fff" stroke="var(--purple)" stroke-width="1.2"/>
    <text class="s" x="433" y="106" text-anchor="middle">odom …</text>
    <line x1="331" y1="102" x2="335" y2="102" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag)"/>
    <line x1="393" y1="102" x2="397" y2="102" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag)"/>
  </g>

  <!-- ③ Fixed Frame -->
  <line x1="488" y1="93" x2="540" y2="93" stroke="var(--green)" stroke-width="1.5" marker-end="url(#ag)"/>
  <text class="l" x="514" y="82" text-anchor="middle">变换到基准</text>
  <rect x="544" y="52" width="186" height="82" rx="6" fill="#fff"/>
  <rect x="544" y="52" width="186" height="82" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.5"/>
  <text class="t" x="637" y="78" text-anchor="middle">Fixed Frame：观测基准</text>
  <text class="s" x="637" y="98" text-anchor="middle">Global Options 设置</text>
  <text class="s" x="637" y="116" text-anchor="middle">例 map / base_footprint</text>

  <!-- ④ 绘制 -->
  <line x1="637" y1="134" x2="637" y2="186" stroke="var(--teal)" stroke-width="1.5" marker-end="url(#at)"/>
  <text class="l" x="648" y="164">OGRE 绘制</text>
  <rect x="544" y="190" width="186" height="64" rx="6" fill="#fff"/>
  <rect x="544" y="190" width="186" height="64" rx="6" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="2"/>
  <text class="t" x="637" y="216" text-anchor="middle">视口点云 · 该图层亮起</text>
  <text class="s" x="637" y="236" text-anchor="middle">Frame Rate 30 按需重绘</text>

  <!-- 断链风险 -->
  <rect x="256" y="200" width="264" height="86" rx="6" fill="#fff"/>
  <rect x="256" y="200" width="264" height="86" rx="6" fill="var(--red-bg)" stroke="var(--red)" stroke-width="1.5"/>
  <text class="t" x="388" y="226" text-anchor="middle">链上断一跳（风险）</text>
  <text class="s" x="388" y="248" text-anchor="middle">该 Display 报黄 Transform [sender=unknown]</text>
  <text class="s" x="388" y="268" text-anchor="middle">拒绝绘制 · 其余图层照常</text>
  <line x1="388" y1="166" x2="388" y2="198" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  <text class="l" x="398" y="186">缺跳</text>

  <!-- 消费者边界注释 -->
  <rect x="30" y="86" width="0" height="0"/>
  <text class="s" x="160" y="330" text-anchor="middle">rviz2 只是消费者：不发话题、不产 TF，上游停则画面停</text>
  <rect x="544" y="286" width="186" height="44" rx="6" fill="#fff"/>
  <rect x="544" y="286" width="186" height="44" rx="6" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="t" x="637" y="306" text-anchor="middle">上游未发布（例）</text>
  <text class="s" x="637" y="324" text-anchor="middle">Global Status：错帧/无数据</text>
  <line x1="637" y1="254" x2="637" y2="284" stroke="var(--gray)" stroke-width="1.5" stroke-dasharray="5,4"/>
</svg>
<div class="dock">
  <span class="ok">✅ 结论：读 frame_id → 沿 TF 链变换到 Fixed Frame → OGRE 绘制</span>
  <span class="warn">⚠️ 风险：TF 断链 → 该图层单独报黄，其余图层不受影响</span>
  <span class="evid">🔍 验证：04 节 tf2_echo base_footprint→base_link 实测 + 黄字诊断台</span>
</div>
<div class="ft">EXP-15 · rviz2 三维可视化</div>
</body>
</html>
