<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图 17-3 · integrated_launch 编排流程</title>
<style>
:root{--bg-page:#ffffff;--bg-card:#ffffff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;
  --border:#e2e8f0;--teal:#0891b2;--green:#059669;--purple:#7c3aed;--orange:#ea580c;--red:#e11d48;--gray:#64748b;
  --teal-bg:rgba(8,145,178,.08);--green-bg:rgba(5,150,105,.08);--purple-bg:rgba(124,58,237,.08);
  --orange-bg:rgba(234,88,12,.10);--gray-bg:rgba(100,116,139,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--text);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 14px 12px}
.hd{margin-bottom:6px}
.hd h1{font-size:15px;margin:0 0 4px}
.hd .q{font-size:12px;color:var(--text2);margin:0}
svg{width:100%;height:auto;display:block}
.t{font:600 12.5px system-ui,sans-serif;fill:var(--text)}
.s{font:400 10.5px system-ui,sans-serif;fill:var(--text2)}
.l{font:600 10.5px ui-monospace,Consolas,monospace;fill:var(--text2)}
.dock{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dock span{font-size:11.5px;border-radius:999px;padding:3px 10px;line-height:1.6}
.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.warn{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.evid{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.ft{font-size:10.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>
<body>
<div class="hd">
  <h1>图 17-3 · integrated_launch 编排流程：参数底座 + 三件套合体</h1>
  <p class="q">本图回答的问题：一份综合 launch 里，参数、remap、条件、事件、外部进程分别挂在哪里、由谁决定起不起？</p>
</div>
<svg viewBox="0 0 760 500" role="img" aria-label="integrated_launch 编排流程图">
  <!-- 参数底座 -->
  <rect x="34" y="34" width="692" height="74" rx="9" fill="#fff"/>
  <rect x="34" y="34" width="692" height="74" rx="9" fill="var(--purple-bg)" stroke="var(--purple)" stroke-width="1.8"/>
  <text class="t" x="380" y="60" text-anchor="middle">参数底座：DeclareLaunchArgument（默认值） ← 命令行 key:=value 覆盖</text>
  <text class="s" x="180" y="88" text-anchor="middle" font-weight="600">sensor_topic=/sensor_data</text>
  <text class="s" x="430" y="88" text-anchor="middle" font-weight="600">enable_debug=false</text>
  <text class="s" x="620" y="88" text-anchor="middle" font-weight="600">enable_bag_record=false</text>

  <line x1="380" y1="108" x2="380" y2="140" stroke="var(--purple)" stroke-width="1.6" marker-end="url(#ap)"/>
  <text class="l" x="392" y="130" fill="var(--purple)">LaunchConfiguration 分发取值</text>

  <!-- 核心链 -->
  <rect x="34" y="144" width="430" height="130" rx="9" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.8"/>
  <text class="t" x="249" y="170" text-anchor="middle">核心链（恒启动 · 实线）</text>
  <rect x="54" y="184" width="176" height="44" rx="7" fill="#fff" stroke="var(--green)"/>
  <text class="s" x="142" y="211" text-anchor="middle" font-weight="600">sensor_driver (talker)</text>
  <line x1="230" y1="206" x2="266" y2="206" stroke="var(--teal)" stroke-width="1.6" marker-end="url(#at)"/>
  <text class="l" x="232" y="198" fill="var(--teal)" font-size="9">话题</text>
  <rect x="270" y="184" width="176" height="44" rx="7" fill="#fff" stroke="var(--green)"/>
  <text class="s" x="358" y="211" text-anchor="middle" font-weight="600">data_processor (listener)</text>
  <text class="s" x="249" y="256" text-anchor="middle">双方 remappings=[('/chatter', sensor_topic)] ← 目标名来自参数底座</text>

  <!-- 条件组 -->
  <rect x="486" y="144" width="240" height="130" rx="9" fill="#fff"/>
  <rect x="486" y="144" width="240" height="130" rx="9" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text class="t" x="606" y="170" text-anchor="middle" fill="var(--orange)">条件组（虚线 · IfCondition）</text>
  <text class="s" x="504" y="200">enable_debug:=true → debug_monitor</text>
  <text class="s" x="504" y="226">enable_bag_record:=true →</text>
  <text class="s" x="504" y="248">ExecuteProcess: ros2 bag record</text>
  <text class="s" x="504" y="266" fill="var(--gray)" font-size="9.5">默认 false 时进程根本不创建</text>

  <!-- 事件恢复 -->
  <rect x="34" y="304" width="430" height="104" rx="9" fill="#fff"/>
  <rect x="34" y="304" width="430" height="104" rx="9" fill="var(--red)" fill-opacity=".06" stroke="var(--red)" stroke-width="1.8"/>
  <text class="t" x="249" y="330" text-anchor="middle" fill="var(--red)">事件恢复（OnProcessExit · 监听 sensor_driver 退出）</text>
  <text class="s" x="52" y="358">① target_action=sensor_node（变量引用，非字符串名）</text>
  <text class="s" x="52" y="382">② on_exit=[LogInfo → 起 sensor_driver_recovered]</text>
  <text class="s" x="52" y="402" fill="var(--gray)" font-size="10">kill 掉原驱动 → 自动补位，node list 里看到 _recovered</text>

  <line x1="142" y1="228" x2="142" y2="300" stroke="var(--red)" stroke-width="1.6" marker-end="url(#ar)"/>
  <text class="l" x="152" y="272" fill="var(--red)">退出触发</text>

  <!-- 验证输出 -->
  <rect x="486" y="304" width="240" height="104" rx="9" fill="var(--teal-bg)" stroke="var(--teal)" stroke-width="1.8"/>
  <text class="t" x="606" y="330" text-anchor="middle">两种跑法对照</text>
  <text class="s" x="504" y="356">默认：2 节点 / 话题 /sensor_data</text>
  <text class="s" x="504" y="380">全开 + 换话题：4 进程 + bag 落盘</text>
  <text class="s" x="504" y="400" fill="var(--gray)" font-size="10">源码一字不改，只有命令行不同</text>

  <!-- 底部：ROS2 异步提示 -->
  <rect x="34" y="434" width="692" height="48" rx="8" fill="var(--gray-bg)" stroke="var(--gray)" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text class="s" x="380" y="455" text-anchor="middle" font-weight="600">订阅关系是异步的：listener 不需要等 sensor_driver "启动完成"——</text>
  <text class="s" x="380" y="474" text-anchor="middle">事件机制解决的是"进程生死"的时序，不是"话题连通"的时序</text>

  <defs>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--purple)"/></marker>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--teal)"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--red)"/></marker>
  </defs>
</svg>
<div class="dock">
  <span class="ok">✅ 参数是底座：remap 目标名、条件判断、bag 开关全从命令行喂入</span>
  <span class="warn">⚠️ target_action 传字符串会静默失效 · 同名 condition False 也占号</span>
  <span class="evid">🔍 04 节综合整合：默认 2 节点 / 全开 4 进程 / kill 补位</span>
</div>
<div class="ft">EXP-17 · Launch 启动系统</div>
</body>
</html>
