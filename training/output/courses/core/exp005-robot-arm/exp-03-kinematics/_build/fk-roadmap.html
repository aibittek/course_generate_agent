<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正运动学 FK · 从关节角到指尖位姿</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-container: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;

      --grid-color: #e2e8f0;
      --grid-opacity: 0.55;

      --frontend-fill: rgba(6, 182, 212, 0.08);
      --frontend-stroke: #0891b2;
      --frontend-text: #0e7490;

      --backend-fill: rgba(16, 185, 129, 0.08);
      --backend-stroke: #059669;
      --backend-text: #047857;

      --database-fill: rgba(139, 92, 246, 0.08);
      --database-stroke: #7c3aed;
      --database-text: #6d28d9;

      --cloud-fill: rgba(245, 158, 11, 0.08);
      --cloud-stroke: #d97706;
      --cloud-text: #b45309;

      --security-fill: rgba(244, 63, 94, 0.08);
      --security-stroke: #e11d48;
      --security-text: #be123c;

      --external-fill: rgba(100, 116, 139, 0.08);
      --external-stroke: #64748b;
      --external-text: #475569;

      --arrow-color: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'JetBrains Mono', 'Noto Sans CJK SC', 'Microsoft YaHei', monospace;
      background: var(--bg-page);
      padding: 0.5rem 0.6rem;
      color: var(--text-primary);
    }

    .container { max-width: 1180px; margin: 0 auto; }
    .diagram-container { background: var(--bg-container); border-radius: 0.6rem; border: 1px solid var(--border); padding: 0.4rem; overflow: hidden; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="diagram-container">
      <svg viewBox="0 0 1180 620">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow-color)" />
          </marker>
          <marker id="arrowGreen" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 9 3, 0 6" fill="var(--backend-stroke)" />
          </marker>
          <marker id="arrowViolet" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 9 3, 0 6" fill="var(--frontend-stroke)" />
          </marker>
          <marker id="arrowAmber" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 9 3, 0 6" fill="var(--cloud-stroke)" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--grid-color)" stroke-width="0.5" opacity="var(--grid-opacity)" />
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- ===== 第一行：输入 → 输出 ===== -->
        <text x="24" y="30" fill="var(--text-primary)" font-size="15" font-weight="700">这件事本身：输入 5 个角，输出 6 个数</text>

        <rect x="24" y="44" width="500" height="66" rx="7" fill="var(--bg-container)" />
        <rect x="24" y="44" width="500" height="66" rx="7" fill="var(--security-fill)" stroke="var(--security-stroke)" stroke-width="1.6" />
        <text x="274" y="70" fill="var(--text-primary)" font-size="15" font-weight="700" text-anchor="middle">已知：5 个关节角 q1 ~ q5</text>
        <text x="274" y="93" fill="var(--security-text)" font-size="12.5" text-anchor="middle">例：(0°, −50°, 105°, 35°, 0°)</text>

        <line x1="534" y1="77" x2="586" y2="77" stroke="var(--arrow-color)" stroke-width="1.8" marker-end="url(#arrowhead)" />
        <text x="560" y="68" fill="var(--text-secondary)" font-size="12" text-anchor="middle">算</text>

        <rect x="596" y="44" width="560" height="66" rx="7" fill="var(--bg-container)" />
        <rect x="596" y="44" width="560" height="66" rx="7" fill="var(--frontend-fill)" stroke="var(--frontend-stroke)" stroke-width="1.6" />
        <text x="876" y="70" fill="var(--text-primary)" font-size="15" font-weight="700" text-anchor="middle">要求：TCP 位姿 = 位置 3 个数 + 姿态 3 个数</text>
        <text x="876" y="93" fill="var(--frontend-text)" font-size="12.5" text-anchor="middle">位置 (0.157, 0, 0.342) m　姿态：工具段水平、夹爪朝向 q1+q5</text>

        <!-- ===== 第二行：七级台阶 ===== -->
        <text x="24" y="152" fill="var(--text-primary)" font-size="15" font-weight="700">学它的七级台阶</text>
        <text x="176" y="152" fill="var(--text-secondary)" font-size="12.5">前四级手算打通（让你懂），第 5、6 级换成矩阵（让程序能算），两条都得走</text>

        <!-- 主线区 -->
        <rect x="24" y="168" width="712" height="290" rx="11" fill="var(--backend-fill)" stroke="var(--backend-stroke)" stroke-width="1" stroke-dasharray="7,4" opacity="0.5" />
        <text x="40" y="192" fill="var(--backend-text)" font-size="13.5" font-weight="700">第一步 · 手算打通：用三角函数一段段算出来</text>

        <!-- 可选区 -->
        <rect x="752" y="168" width="404" height="290" rx="11" fill="var(--cloud-fill)" stroke="var(--cloud-stroke)" stroke-width="1" stroke-dasharray="7,4" opacity="0.5" />
        <text x="768" y="192" fill="var(--cloud-text)" font-size="13.5" font-weight="700">第二步 · 工程实现：用矩阵重写，同样必学</text>

        <!-- 第 1 级 -->
        <rect x="40" y="204" width="200" height="106" rx="7" fill="var(--bg-container)" />
        <rect x="40" y="204" width="200" height="106" rx="7" fill="var(--backend-fill)" stroke="var(--backend-stroke)" stroke-width="1.6" />
        <text x="140" y="228" fill="var(--backend-stroke)" font-size="12" font-weight="700" text-anchor="middle">第 1 级</text>
        <text x="140" y="250" fill="var(--text-primary)" font-size="14.5" font-weight="700" text-anchor="middle">一根棍子</text>
        <text x="140" y="272" fill="var(--backend-text)" font-size="12" text-anchor="middle">前 L·sinθ，上 L·cosθ</text>
        <text x="140" y="294" fill="var(--backend-text)" font-size="12" text-anchor="middle">工具：sin / cos</text>

        <line x1="244" y1="257" x2="278" y2="257" stroke="var(--backend-stroke)" stroke-width="1.8" marker-end="url(#arrowGreen)" />

        <!-- 第 2 级 -->
        <rect x="282" y="204" width="200" height="106" rx="7" fill="var(--bg-container)" />
        <rect x="282" y="204" width="200" height="106" rx="7" fill="var(--backend-fill)" stroke="var(--backend-stroke)" stroke-width="1.6" />
        <text x="382" y="228" fill="var(--backend-stroke)" font-size="12" font-weight="700" text-anchor="middle">第 2 级</text>
        <text x="382" y="250" fill="var(--text-primary)" font-size="14.5" font-weight="700" text-anchor="middle">朝哪边伸</text>
        <text x="382" y="272" fill="var(--backend-text)" font-size="12" text-anchor="middle">航向角投到 x-y 平面</text>
        <text x="382" y="294" fill="var(--backend-text)" font-size="12" text-anchor="middle">工具：水平面分解</text>

        <line x1="486" y1="257" x2="520" y2="257" stroke="var(--backend-stroke)" stroke-width="1.8" marker-end="url(#arrowGreen)" />

        <!-- 第 3 级 -->
        <rect x="524" y="204" width="200" height="106" rx="7" fill="var(--bg-container)" />
        <rect x="524" y="204" width="200" height="106" rx="7" fill="var(--backend-fill)" stroke="var(--backend-stroke)" stroke-width="1.6" />
        <text x="624" y="228" fill="var(--backend-stroke)" font-size="12" font-weight="700" text-anchor="middle">第 3 级</text>
        <text x="624" y="250" fill="var(--text-primary)" font-size="14.5" font-weight="700" text-anchor="middle">三节串起来</text>
        <text x="624" y="272" fill="var(--backend-text)" font-size="12" text-anchor="middle">角度累加 q2、q2+q3…</text>
        <text x="624" y="294" fill="var(--backend-text)" font-size="12" text-anchor="middle">工具：向量相加</text>

        <!-- 第 4 级 -->
        <line x1="624" y1="314" x2="624" y2="336" stroke="var(--backend-stroke)" stroke-width="1.8" marker-end="url(#arrowGreen)" />
        <rect x="40" y="340" width="684" height="104" rx="7" fill="var(--bg-container)" />
        <rect x="40" y="340" width="684" height="104" rx="7" fill="var(--frontend-fill)" stroke="var(--frontend-stroke)" stroke-width="2" />
        <text x="382" y="364" fill="var(--frontend-stroke)" font-size="12" font-weight="700" text-anchor="middle">第 4 级 · ★ 走到这里，你就真的懂了</text>
        <text x="382" y="388" fill="var(--text-primary)" font-size="15" font-weight="700" text-anchor="middle">手算出位姿：位置 + 姿态</text>
        <text x="382" y="411" fill="var(--frontend-text)" font-size="12.5" text-anchor="middle">位置 (0.157, 0, 0.342) m　姿态：累计角 −50+105+35 = 90°，工具段水平</text>
        <text x="382" y="432" fill="var(--frontend-text)" font-size="12" text-anchor="middle">一个计算器就算得完，每一步都知道自己在干什么</text>

        <!-- 第 5 级 -->
        <rect x="768" y="204" width="372" height="106" rx="7" fill="var(--bg-container)" />
        <rect x="768" y="204" width="372" height="106" rx="7" fill="var(--cloud-fill)" stroke="var(--cloud-stroke)" stroke-width="1.6" />
        <text x="782" y="228" fill="var(--cloud-stroke)" font-size="12" font-weight="700">第 5 级</text>
        <text x="954" y="228" fill="var(--text-primary)" font-size="14.5" font-weight="700" text-anchor="middle">旋转矩阵 2×2 / 3×3</text>
        <text x="954" y="252" fill="var(--cloud-text)" font-size="12" text-anchor="middle">三段公式打包成一个模板，套角度就出结果</text>
        <text x="954" y="274" fill="var(--cloud-text)" font-size="12" text-anchor="middle">3×3 的三列 = 物体三根轴的方向</text>
        <text x="954" y="296" fill="var(--cloud-text)" font-size="11.5" text-anchor="middle">新工具：旋转矩阵</text>

        <line x1="954" y1="314" x2="954" y2="336" stroke="var(--cloud-stroke)" stroke-width="1.8" marker-end="url(#arrowAmber)" />

        <!-- 第 6 级 -->
        <rect x="768" y="340" width="372" height="104" rx="7" fill="var(--bg-container)" />
        <rect x="768" y="340" width="372" height="104" rx="7" fill="var(--cloud-fill)" stroke="var(--cloud-stroke)" stroke-width="1.6" />
        <text x="782" y="364" fill="var(--cloud-stroke)" font-size="12" font-weight="700">第 6 级</text>
        <text x="954" y="364" fill="var(--text-primary)" font-size="14.5" font-weight="700" text-anchor="middle">齐次矩阵 4×4</text>
        <text x="954" y="388" fill="var(--cloud-text)" font-size="12" text-anchor="middle">「转 + 挪」合成一次乘法，可以一直连乘</text>
        <text x="954" y="410" fill="var(--cloud-text)" font-size="12" text-anchor="middle">ROS / URDF 内部就是这么算的</text>
        <text x="954" y="432" fill="var(--cloud-text)" font-size="11.5" text-anchor="middle">程序里跑的就是这一套，新工具：齐次矩阵</text>

        <!-- 等价说明 -->
        <path d="M 730 390 L 762 390" fill="none" stroke="var(--cloud-stroke)" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowAmber)" />
        <text x="746" y="378" fill="var(--cloud-text)" font-size="10" text-anchor="middle">同答案</text>
        <text x="746" y="412" fill="var(--cloud-text)" font-size="10" text-anchor="middle">多能力</text>

        <!-- ===== 第三行：第 7 级 ===== -->
        <line x1="382" y1="444" x2="382" y2="474" stroke="var(--arrow-color)" stroke-width="1.6" />
        <line x1="954" y1="444" x2="954" y2="474" stroke="var(--arrow-color)" stroke-width="1.6" />
        <line x1="382" y1="474" x2="954" y2="474" stroke="var(--arrow-color)" stroke-width="1.6" />
        <line x1="668" y1="474" x2="668" y2="500" stroke="var(--arrow-color)" stroke-width="1.8" marker-end="url(#arrowhead)" />

        <rect x="330" y="504" width="680" height="72" rx="7" fill="var(--bg-container)" />
        <rect x="330" y="504" width="680" height="72" rx="7" fill="var(--external-fill)" stroke="var(--external-stroke)" stroke-width="1.6" />
        <text x="348" y="530" fill="var(--external-text)" font-size="12" font-weight="700">第 7 级</text>
        <text x="682" y="530" fill="var(--text-primary)" font-size="15" font-weight="700" text-anchor="middle">上真机：PWM → 关节角 → 位姿，再用卷尺校对</text>
        <text x="682" y="552" fill="var(--external-text)" font-size="12" text-anchor="middle">rad = (PWM − 1500) × 0.002356，套同一套公式；pwm_to_tcp.py 直接打印位置和姿态</text>
        <text x="682" y="570" fill="var(--external-text)" font-size="11.5" text-anchor="middle">验收：手算、程序输出、卷尺测量，三者差在 5 mm 以内</text>

        <!-- ===== 图例 ===== -->
        <g font-size="12">
          <rect x="24" y="596" width="16" height="9" rx="2" fill="var(--backend-fill)" stroke="var(--backend-stroke)" stroke-width="1" />
          <text x="46" y="604" fill="var(--text-secondary)">第 1~3 级：打通手算</text>

          <rect x="200" y="596" width="16" height="9" rx="2" fill="var(--frontend-fill)" stroke="var(--frontend-stroke)" stroke-width="1" />
          <text x="222" y="604" fill="var(--text-secondary)">第 4 级：目标达成</text>

          <rect x="372" y="596" width="16" height="9" rx="2" fill="var(--cloud-fill)" stroke="var(--cloud-stroke)" stroke-width="1" />
          <text x="394" y="604" fill="var(--text-secondary)">第 5~6 级：矩阵重建，必学</text>

          <rect x="592" y="596" width="16" height="9" rx="2" fill="var(--external-fill)" stroke="var(--external-stroke)" stroke-width="1" />
          <text x="614" y="604" fill="var(--text-secondary)">第 7 级：真机核对</text>

          <line x1="754" y1="600" x2="774" y2="600" stroke="var(--arrow-color)" stroke-width="1.6" marker-end="url(#arrowhead)" />
          <text x="782" y="604" fill="var(--text-secondary)">先学这个，再学那个</text>

          <line x1="934" y1="600" x2="954" y2="600" stroke="var(--cloud-stroke)" stroke-width="1.4" stroke-dasharray="5,4" />
          <text x="962" y="604" fill="var(--text-secondary)">同一答案，多一种能力</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
