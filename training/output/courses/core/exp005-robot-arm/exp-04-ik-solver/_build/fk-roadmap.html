<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逆运动学 IK · 从指尖位姿反解关节角</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-container: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --grid-color: #e2e8f0;
      --grid-opacity: 0.55;

      --frontend-fill: rgba(6, 182, 212, 0.08);
      --frontend-stroke: #0891b2;
      --frontend-text: #0e7490;

      --backend-fill: rgba(16, 185, 129, 0.08);
      --backend-stroke: #059669;
      --backend-text: #047857;

      --database-fill: rgba(139, 92, 246, 0.08);
      --database-stroke: #7c3aed;
      --database-text: #6d28d9;

      --cloud-fill: rgba(245, 158, 11, 0.08);
      --cloud-stroke: #d97706;
      --cloud-text: #b45309;

      --security-fill: rgba(244, 63, 94, 0.08);
      --security-stroke: #e11d48;
      --security-text: #be123c;

      --external-fill: rgba(100, 116, 139, 0.08);
      --external-stroke: #64748b;
      --external-text: #475569;

      --arrow-color: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'JetBrains Mono', 'Noto Sans CJK SC', 'Microsoft YaHei', monospace;
      background: var(--bg-page);
      padding: 0.5rem 0.6rem;
      color: var(--text-primary);
    }

    .container { max-width: 1180px; margin: 0 auto; }
    .diagram-container { background: var(--bg-container); border-radius: 0.6rem; border: 1px solid var(--border); padding: 0.4rem; overflow: hidden; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="diagram-container">
      <svg viewBox="0 0 1180 620">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow-color)" />
          </marker>
          <marker id="arrowGreen" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 9 3, 0 6" fill="var(--backend-stroke)" />
          </marker>
          <marker id="arrowViolet" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 9 3, 0 6" fill="var(--database-stroke)" />
          </marker>
          <marker id="arrowAmber" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 9 3, 0 6" fill="var(--cloud-stroke)" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--grid-color)" stroke-width="0.5" opacity="var(--grid-opacity)" />
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- ===== 第一行：输入 → 输出（和 FK 正好反过来）===== -->
        <text x="24" y="30" fill="var(--text-primary)" font-size="15" font-weight="700">这件事本身：输入 6 个数，输出 5 个角</text>

        <rect x="24" y="44" width="500" height="66" rx="7" fill="var(--bg-container)" />
        <rect x="24" y="44" width="500" height="66" rx="7" fill="var(--security-fill)" stroke="var(--security-stroke)" stroke-width="1.6" />
        <text x="274" y="70" fill="var(--text-primary)" font-size="15" font-weight="700" text-anchor="middle">已知：指尖要到的位姿</text>
        <text x="274" y="93" fill="var(--security-text)" font-size="12.5" text-anchor="middle">位置 (x, y, z) + 姿态（工具朝哪）</text>

        <line x1="534" y1="77" x2="586" y2="77" stroke="var(--arrow-color)" stroke-width="1.8" marker-end="url(#arrowhead)" />
        <text x="560" y="68" fill="var(--text-secondary)" font-size="12" text-anchor="middle">反解</text>

        <rect x="596" y="44" width="560" height="66" rx="7" fill="var(--bg-container)" />
        <rect x="596" y="44" width="560" height="66" rx="7" fill="var(--frontend-fill)" stroke="var(--frontend-stroke)" stroke-width="1.6" />
        <text x="876" y="70" fill="var(--text-primary)" font-size="15" font-weight="700" text-anchor="middle">要求：q1 ~ q5 各是什么角</text>
        <text x="876" y="93" fill="var(--frontend-text)" font-size="12.5" text-anchor="middle">答案可能不止一组，也可能根本没有答案</text>

        <!-- ===== 第二行：七级台阶 ===== -->
        <text x="24" y="152" fill="var(--text-primary)" font-size="15" font-weight="700">学它的七级台阶</text>
        <text x="176" y="152" fill="var(--text-secondary)" font-size="12.5">第 1~4 级先把几何解出来（让你懂），第 5、6 级用数值法兜底（让程序不挑情况），两条都得走</text>

        <rect x="24" y="168" width="712" height="290" rx="11" fill="var(--backend-fill)" stroke="var(--backend-stroke)" stroke-width="1" stroke-dasharray="7,4" opacity="0.5" />
        <text x="40" y="192" fill="var(--backend-text)" font-size="13.5" font-weight="700">第一步 · 几何解：用余弦定理直接算出来</text>

        <rect x="752" y="168" width="404" height="290" rx="11" fill="var(--cloud-fill)" stroke="var(--cloud-stroke)" stroke-width="1" stroke-dasharray="7,4" opacity="0.5" />
        <text x="768" y="192" fill="var(--cloud-text)" font-size="13.5" font-weight="700">第二步 · 数值解：也必学，用于几何法失效时</text>

        <!-- 第 1 级 -->
        <rect x="40" y="204" width="200" height="106" rx="7" fill="var(--bg-container)" />
        <rect x="40" y="204" width="200" height="106" rx="7" fill="var(--backend-fill)" stroke="var(--backend-stroke)" stroke-width="1.6" />
        <text x="140" y="228" fill="var(--backend-stroke)" font-size="12" font-weight="700" text-anchor="middle">第 1 级</text>
        <text x="140" y="250" fill="var(--text-primary)" font-size="14.5" font-weight="700" text-anchor="middle">先转底座</text>
        <text x="140" y="272" fill="var(--backend-text)" font-size="12" text-anchor="middle">q1 管方向，俯视图看一眼</text>
        <text x="140" y="294" fill="var(--backend-text)" font-size="12" text-anchor="middle">新工具：atan2</text>

        <line x1="244" y1="257" x2="278" y2="257" stroke="var(--backend-stroke)" stroke-width="1.8" marker-end="url(#arrowGreen)" />

        <!-- 第 2 级 -->
        <rect x="282" y="204" width="200" height="106" rx="7" fill="var(--bg-container)" />
        <rect x="282" y="204" width="200" height="106" rx="7" fill="var(--backend-fill)" stroke="var(--backend-stroke)" stroke-width="1.6" />
        <text x="382" y="228" fill="var(--backend-stroke)" font-size="12" font-weight="700" text-anchor="middle">第 2 级</text>
        <text x="382" y="250" fill="var(--text-primary)" font-size="14.5" font-weight="700" text-anchor="middle">两杆怎么弯</text>
        <text x="382" y="272" fill="var(--backend-text)" font-size="12" text-anchor="middle">余弦定理求 q3</text>
        <text x="382" y="294" fill="var(--backend-text)" font-size="12" text-anchor="middle">新工具：余弦定理</text>

        <line x1="486" y1="257" x2="520" y2="257" stroke="var(--backend-stroke)" stroke-width="1.8" marker-end="url(#arrowGreen)" />

        <!-- 第 3 级 -->
        <rect x="524" y="204" width="200" height="106" rx="7" fill="var(--bg-container)" />
        <rect x="524" y="204" width="200" height="106" rx="7" fill="var(--backend-fill)" stroke="var(--backend-stroke)" stroke-width="1.6" />
        <text x="624" y="228" fill="var(--backend-stroke)" font-size="12" font-weight="700" text-anchor="middle">第 3 级</text>
        <text x="624" y="250" fill="var(--text-primary)" font-size="14.5" font-weight="700" text-anchor="middle">两组解选一个</text>
        <text x="624" y="272" fill="var(--backend-text)" font-size="12" text-anchor="middle">肘上 / 肘下，都到得了</text>
        <text x="624" y="294" fill="var(--backend-text)" font-size="12" text-anchor="middle">新概念：多解</text>

        <!-- 第 4 级 -->
        <line x1="624" y1="314" x2="624" y2="336" stroke="var(--backend-stroke)" stroke-width="1.8" marker-end="url(#arrowGreen)" />
        <rect x="40" y="340" width="684" height="104" rx="7" fill="var(--bg-container)" />
        <rect x="40" y="340" width="684" height="104" rx="7" fill="var(--frontend-fill)" stroke="var(--frontend-stroke)" stroke-width="2" />
        <text x="382" y="364" fill="var(--frontend-stroke)" font-size="12" font-weight="700" text-anchor="middle">第 4 级 · ★ 走到这里，你已经能自己反解了</text>
        <text x="382" y="388" fill="var(--text-primary)" font-size="15" font-weight="700" text-anchor="middle">完整链路：倒推 J4 → 两杆逆解 → 补 q4</text>
        <text x="382" y="411" fill="var(--frontend-text)" font-size="12.5" text-anchor="middle">目标 TCP (0.157, 0.342) + 工具水平 → q2 −50.0° / q3 105.0° / q4 35.0°</text>
        <text x="382" y="432" fill="var(--frontend-text)" font-size="12" text-anchor="middle">一支笔一张纸就能算，FK 回代验证误差为 0</text>

        <!-- 第 5 级 -->
        <rect x="768" y="204" width="372" height="106" rx="7" fill="var(--bg-container)" />
        <rect x="768" y="204" width="372" height="106" rx="7" fill="var(--cloud-fill)" stroke="var(--cloud-stroke)" stroke-width="1.6" />
        <text x="782" y="228" fill="var(--cloud-stroke)" font-size="12" font-weight="700">第 5 级</text>
        <text x="954" y="228" fill="var(--text-primary)" font-size="14.5" font-weight="700" text-anchor="middle">雅可比：抖一下看看</text>
        <text x="954" y="252" fill="var(--cloud-text)" font-size="12" text-anchor="middle">关节角动一点点，指尖动多少</text>
        <text x="954" y="274" fill="var(--cloud-text)" font-size="12" text-anchor="middle">它就是"换算汇率表"，迭代法靠它指路</text>
        <text x="954" y="296" fill="var(--cloud-text)" font-size="11.5" text-anchor="middle">新工具：雅可比矩阵</text>

        <line x1="954" y1="314" x2="954" y2="336" stroke="var(--cloud-stroke)" stroke-width="1.8" marker-end="url(#arrowAmber)" />

        <!-- 第 6 级 -->
        <rect x="768" y="340" width="372" height="104" rx="7" fill="var(--bg-container)" />
        <rect x="768" y="340" width="372" height="104" rx="7" fill="var(--cloud-fill)" stroke="var(--cloud-stroke)" stroke-width="1.6" />
        <text x="782" y="364" fill="var(--cloud-stroke)" font-size="12" font-weight="700">第 6 级</text>
        <text x="954" y="364" fill="var(--text-primary)" font-size="14.5" font-weight="700" text-anchor="middle">数值迭代与奇异</text>
        <text x="954" y="388" fill="var(--cloud-text)" font-size="12" text-anchor="middle">一步挪一点，逼近目标；手臂伸直时卡住</text>
        <text x="954" y="410" fill="var(--cloud-text)" font-size="12" text-anchor="middle">源码 ik_analytical.py / 数值法对照</text>
        <text x="954" y="432" fill="var(--cloud-text)" font-size="11.5" text-anchor="middle">程序里两套都实现了，可按需选</text>

        <!-- 汇合说明 -->
        <path d="M 730 390 L 762 390" fill="none" stroke="var(--cloud-stroke)" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowAmber)" />
        <text x="746" y="378" fill="var(--cloud-text)" font-size="10" text-anchor="middle">几何法</text>
        <text x="746" y="412" fill="var(--cloud-text)" font-size="10" text-anchor="middle">失效时</text>

        <!-- ===== 第三行：第 7 级 ===== -->
        <line x1="382" y1="444" x2="382" y2="474" stroke="var(--arrow-color)" stroke-width="1.6" />
        <line x1="954" y1="444" x2="954" y2="474" stroke="var(--arrow-color)" stroke-width="1.6" />
        <line x1="382" y1="474" x2="954" y2="474" stroke="var(--arrow-color)" stroke-width="1.6" />
        <line x1="668" y1="474" x2="668" y2="500" stroke="var(--arrow-color)" stroke-width="1.8" marker-end="url(#arrowhead)" />

        <rect x="300" y="504" width="740" height="72" rx="7" fill="var(--bg-container)" />
        <rect x="300" y="504" width="740" height="72" rx="7" fill="var(--external-fill)" stroke="var(--external-stroke)" stroke-width="1.6" />
        <text x="318" y="530" fill="var(--external-text)" font-size="12" font-weight="700">第 7 级</text>
        <text x="682" y="530" fill="var(--text-primary)" font-size="15" font-weight="700" text-anchor="middle">上真机：解出来的角真的能让指尖到位吗</text>
        <text x="682" y="552" fill="var(--external-text)" font-size="12" text-anchor="middle">闭环测试 FK(IK(目标)) 是否回到目标；误差大了要分清"算错"还是"装歪"</text>
        <text x="682" y="570" fill="var(--external-text)" font-size="11.5" text-anchor="middle">验收：解出来的角代回 FK，与目标差在容差内；实机误差可归因</text>

        <!-- ===== 图例 ===== -->
        <g font-size="12">
          <rect x="24" y="596" width="16" height="9" rx="2" fill="var(--backend-fill)" stroke="var(--backend-stroke)" stroke-width="1" />
          <text x="46" y="604" fill="var(--text-secondary)">第 1~3 级：打通几何解</text>

          <rect x="196" y="596" width="16" height="9" rx="2" fill="var(--frontend-fill)" stroke="var(--frontend-stroke)" stroke-width="1" />
          <text x="218" y="604" fill="var(--text-secondary)">第 4 级：完整反解</text>

          <rect x="360" y="596" width="16" height="9" rx="2" fill="var(--cloud-fill)" stroke="var(--cloud-stroke)" stroke-width="1" />
          <text x="382" y="604" fill="var(--text-secondary)">第 5~6 级：数值法，必学</text>

          <rect x="546" y="596" width="16" height="9" rx="2" fill="var(--external-fill)" stroke="var(--external-stroke)" stroke-width="1" />
          <text x="568" y="604" fill="var(--text-secondary)">第 7 级：真机验证</text>

          <line x1="700" y1="600" x2="720" y2="600" stroke="var(--arrow-color)" stroke-width="1.6" marker-end="url(#arrowhead)" />
          <text x="728" y="604" fill="var(--text-secondary)">先学这个，再学那个</text>

          <line x1="880" y1="600" x2="900" y2="600" stroke="var(--cloud-stroke)" stroke-width="1.4" stroke-dasharray="5,4" />
          <text x="908" y="604" fill="var(--text-secondary)">几何法失效时用这个</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
