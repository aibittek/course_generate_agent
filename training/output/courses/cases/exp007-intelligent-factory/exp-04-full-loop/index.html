.card li::marker{color:var(--accent-cyan)}
.bar{height:6px;background:#e2e8f0;border-radius:100px;overflow:hidden;margin-top:22px}

.btn.p{background:var(--accent-blue);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.25)}
.btn.p:hover{transform:translateY(-2px)}
.btn.s{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary)}
.btn.s:hover{border-color:var(--accent-blue);color:var(--accent-blue)}
