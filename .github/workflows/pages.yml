name: Deploy course site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add .nojekyll
        run: touch training/output/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包本机助手（eai-helper.zip）
        run: |
          cd training/output/courses/device
          rm -f eai-helper.zip
          zip -r eai-helper.zip . \
            -x 'helper.log' '*/helper.log' '*__pycache__*' '*.pyc' 'eai-helper.zip'
          unzip -l eai-helper.zip | tail -n 2

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: training/output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4