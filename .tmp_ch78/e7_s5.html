<section class="blk" id="s5">
<h2><span class="no">05</span>服务实验台：亲眼看"同步阻塞"是怎么发生的</h2>
<p>原理读十遍，不如亲手"卡"一次。下面的实验台完整复刻 <code>fingerprint_server</code> 的轮询逻辑（0.2s 一轮、retries=50）：选一种手指状态，点"发起验证"，看请求出去之后客户端在等什么、服务端在干什么。</p>
<div class="ix-panel">
  <div class="ix-title">Service Lab · 发起一次指纹验证</div>
  <div class="lab-row">
    <div class="lab-box">
      <h5>手指状态</h5>
      <label>什么时候放手指
        <select id="fpWhen">
          <option value="now">一上来就放好了</option>
          <option value="later">第 5 轮才放上去</option>
          <option value="never">始终不放（等满窗口）</option>
        </select>
      </label>
    </div>
    <div class="lab-box">
      <h5>服务端写法（做个对照）</h5>
      <label class="switch-row" style="margin:6px 0">
        <input type="checkbox" id="fpErr"> 把 0x02 当作错误立即返回（错误示范）
      </label>
    </div>
  </div>
  <div class="btn-row"><button class="btn" onclick="runSrvLab()">发起验证 call_async →</button></div>
  <div id="srvCells" class="tl-cells" style="margin-top:14px"></div>
  <div class="lab-log" id="srvLog"><span class="d">// 选择场景后点「发起验证」，观察轮询与阻塞窗口…</span></div>
  <div class="lab-verdict warn" id="srvVerdict" style="display:none"></div>
</div>
<p class="ix-caption">时间轴每一格 ≈ 一次 0.2s 轮询（为演示只画出前几轮，实际 retries=50）。黄色 = 等待（0x02），粉色 = 干活，绿色 = 拿到结果，红色 = 失败。</p>
</section>

<script>
function runSrvLab(){
  var t=document.getElementById('fpWhen').value;
  var asErr=document.getElementById('fpErr').checked;
  var cells=[],log=[];
  log.push('<span class="d">$ [client] call_async(/verify_fingerprint) 请求已发出，进入 spin_until_future_complete 等待…</span>');
  var vEl=document.getElementById('srvVerdict'), vCls='ok', vTxt='';
  if(asErr){
    cells.push({t:'0x02',c:'bad'});
    log.push('<span class="r">[server] 第 1 轮 get_image → 确认码 0x02（无手指）→ 被当作错误处理</span>');
    log.push('<span class="r">[client] 收到 Response：success=false  message="采集图像失败(code=0x02)"</span>');
    log.push('<span class="d">// 总耗时 &lt;0.2s——快是快了，但用户手指还没放稳</span>');
    vCls='bad';
    vTxt='✘ 状态被误当错误：10 秒等待窗口完全失效，用户必然"验证失败"。区分 0x02（状态，继续等）与 0x01（错误，返回失败）是鲁棒性第一课。';
  }else if(t==='never'){
    for(var i=0;i<10;i++) cells.push({t:'0x02',c:'wait'});
    cells.push({t:'…',c:'wait'});
    cells.push({t:'超时',c:'bad'});
    log.push('<span class="y">[server] 第 1~50 轮 get_image 全部返回 0x02（无手指）→ sleep(0.2) 继续等</span>');
    log.push('<span class="y">[server] 轮询计数 50/50 耗尽，退出循环</span>');
    log.push('<span class="r">[client] 约 10s 后收到 Response：success=false  message="超时，未检测到手指"</span>');
    log.push('<span class="d">// 这 10 秒里客户端一行代码都没法执行——同步阻塞的全部代价</span>');
    vCls='warn';
    vTxt='⚠ 等待窗口给了用户反应时间，但客户端也整整卡了 10 秒。如果这种"长时间等待 + 想中途放弃"成为常态，就该升级成动作了（EXP-08）。';
  }else{
    var n=(t==='later')?5:1;
    for(var j=1;j<n;j++) cells.push({t:'0x02',c:'wait'});
    cells.push({t:'0x00',c:'act'});
    cells.push({t:'特征',c:'act'});
    cells.push({t:'比对',c:'act'});
    cells.push({t:'✓',c:'ok'});
    if(n>1) log.push('<span class="d">[server] 第 1~'+(n-1)+' 轮 get_image → 0x02（无手指）→ sleep(0.2) 继续</span>');
    log.push('<span class="g">[server] 第 '+n+' 轮 get_image → 0x00 ✓ 采到指纹图像</span>');
    log.push('<span class="g">[server] gen_char(1) 生成特征 → search() 命中：user_id=1  score=1151</span>');
    log.push('<span class="g">[client] 收到 Response：success=true  user_id=1  message="匹配成功 score=1151"</span>');
    log.push('<span class="d">// 从发出到拿结果的全部时间里，客户端都阻塞在等待上——这就是"同步"</span>');
    vCls='ok';
    vTxt='✓ 一问一答完成：应答语义内建，success/user_id 直接可判定。代价是等待期间客户端什么都做不了——短耗时场景这正是想要的确定性。';
  }
  var cEl=document.getElementById('srvCells'); cEl.innerHTML='';
  cells.forEach(function(c){var d=document.createElement('div');d.className='c '+c.c;d.textContent=c.t;cEl.appendChild(d);});
  document.getElementById('srvLog').innerHTML=log.join('\n');
  vEl.className='lab-verdict '+vCls; vEl.textContent=vTxt; vEl.style.display='block';
}
runSrvLab();
</script>
